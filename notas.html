<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduGestión — Notas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1A4F8A; --azul-dark: #123769; --azul-light: #EBF2FB;
  --verde: #1A7A5E; --verde-light: #E8F5F0;
  --naranja: #C05621; --naranja-light: #FFF3EB;
  --rojo: #C53030; --rojo-light: #FFF5F5;
  --amarillo: #B7791F; --amarillo-light: #FFF9E6;
  --gris: #F4F6F9; --borde: #DDE3EC;
  --texto: #1A2332; --texto-mid: #4A5568; --texto-light: #8896A7;
  --blanco: #FFFFFF;
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

.topbar { background: var(--azul); height: 58px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 0.9rem; }
.topbar-back { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.85; }
.topbar-back:hover { opacity: 1; }
.topbar-brand { font-size: 1.0rem; font-weight: 700; color: white; }
.btn-salir { background: rgba(255,255,255,0.12); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }

.main { max-width: 1000px; margin: 0 auto; padding: 2.2rem 2rem 4rem; }
.titulo { font-family: 'Instrument Serif', serif; font-size: 1.8rem; margin-bottom: 1.5rem; }

.filtros-box { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; padding: 1.3rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
.filtro-field { flex: 1; min-width: 160px; }
.filtro-field label { display: block; font-size: 0.74rem; font-weight: 700; color: var(--texto-mid); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.03em; }
.filtro-field select { width: 100%; padding: 0.6rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.85rem; background: white; }

.escala-info { background: var(--azul-light); border-radius: 10px; padding: 0.9rem 1.1rem; margin-bottom: 1.3rem; font-size: 0.8rem; color: var(--azul); display: none; }
.escala-info.visible { display: block; }
.escala-info b { font-weight: 700; }

.oficial-info { background: var(--verde-light); color: var(--verde); border-radius: 10px; padding: 0.8rem 1.1rem; margin-bottom: 1.1rem; font-size: 0.78rem; }
.btn-sugerido { background: none; border: 1.3px solid var(--verde); color: var(--verde); border-radius: 6px; padding: 0.2rem 0.55rem; font-size: 0.68rem; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 0.35rem; }
.btn-sugerido:hover { background: var(--verde); color: white; }

.banco-toggle { background: var(--verde-light); color: var(--verde); border: 1.5px solid var(--verde); padding: 0.5rem 0.9rem; border-radius: 8px; font-weight: 700; font-size: 0.78rem; cursor: pointer; font-family: inherit; margin-bottom: 1rem; display: none; }
.banco-toggle:hover { background: var(--verde); color: white; }
.banco-toggle.visible { display: inline-block; }
.select-logro-banco { width: 100%; padding: 0.4rem 0.5rem; border: 1.5px solid var(--borde); border-radius: 6px; font-family: inherit; font-size: 0.75rem; margin-bottom: 0.35rem; background: var(--gris); color: var(--texto-mid); }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,25,35,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
.modal-box { background: var(--blanco); border-radius: 14px; width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto; padding: 1.6rem; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.modal-header h2 { font-family: 'Instrument Serif', serif; font-size: 1.2rem; }
.modal-close { background: none; border: none; font-size: 1.6rem; color: var(--texto-light); cursor: pointer; }
.banco-item { display: flex; justify-content: space-between; align-items: start; gap: 0.6rem; padding: 0.6rem 0; border-bottom: 1px solid var(--borde); font-size: 0.82rem; }
.banco-item:last-child { border-bottom: none; }
.banco-item-quitar { background: none; border: none; color: var(--texto-light); cursor: pointer; font-size: 1rem; flex-shrink: 0; }
.banco-item-quitar:hover { color: var(--rojo); }
.form-banco { display: flex; gap: 0.5rem; margin-top: 1rem; }
.btn-plantillas-logro { width: 100%; background: var(--gris); border: 1.3px dashed var(--borde); color: var(--texto-mid); padding: 0.6rem; border-radius: 8px; font-weight: 600; font-size: 0.78rem; cursor: pointer; font-family: inherit; margin-top: 0.8rem; }
.btn-plantillas-logro:hover { background: var(--azul-light); color: var(--azul); border-color: var(--azul); }
.form-banco textarea { flex: 1; padding: 0.55rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.82rem; resize: vertical; min-height: 60px; }
.btn-agregar-banco { background: var(--azul); color: white; border: none; border-radius: 8px; padding: 0.5rem 0.9rem; font-weight: 700; font-size: 0.8rem; cursor: pointer; font-family: inherit; align-self: flex-start; }

.aviso { text-align: center; padding: 3rem 1.5rem; color: var(--texto-light); font-size: 0.88rem; background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; }

.tabla-wrap { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; overflow: hidden; display: none; }
.tabla-wrap.visible { display: block; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-light); padding: 0.8rem 1rem; background: var(--gris); border-bottom: 1.5px solid var(--borde); }
td { padding: 0.7rem 1rem; font-size: 0.85rem; border-bottom: 1px solid var(--borde); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.input-nota { width: 80px; padding: 0.45rem 0.6rem; border: 1.5px solid var(--borde); border-radius: 7px; font-family: inherit; font-size: 0.88rem; font-weight: 600; text-align: center; }
.input-nota:focus { outline: none; border-color: var(--azul); }
.input-logro { width: 100%; min-width: 220px; padding: 0.5rem 0.65rem; border: 1.5px solid var(--borde); border-radius: 7px; font-family: inherit; font-size: 0.8rem; resize: vertical; min-height: 42px; }
.input-logro:focus { outline: none; border-color: var(--azul); }
.nivel-chip { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.25rem 0.7rem; border-radius: 10px; }
.nivel-vacio { color: var(--texto-light); font-size: 0.78rem; }
.estado-guardado { font-size: 0.72rem; color: var(--verde); font-weight: 600; }

.footer-acciones { display: flex; justify-content: space-between; align-items: center; margin-top: 1.3rem; }
.btn-primario { background: var(--azul); color: white; border: none; padding: 0.7rem 1.4rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
.btn-primario:hover { background: var(--azul-dark); }
.btn-primario:disabled { opacity: 0.6; cursor: default; }
.contador { font-size: 0.8rem; color: var(--texto-light); }

.loading-wrap { text-align: center; padding: 2rem; color: var(--texto-light); font-size: 0.85rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="dashboard.html" class="topbar-back">← Panel</a>
    <span class="topbar-brand">Notas</span>
  </div>
  <button class="btn-salir" id="btnSalir">Salir</button>
</header>

<main class="main">
  <p class="titulo">Registro de Notas</p>

  <div class="filtros-box">
    <div class="filtro-field">
      <label>Grado / Grupo</label>
      <select id="selGrado"><option value="">Selecciona...</option></select>
    </div>
    <div class="filtro-field">
      <label>Asignatura</label>
      <select id="selAsignatura"><option value="">Selecciona un grado primero</option></select>
    </div>
    <div class="filtro-field">
      <label>Periodo</label>
      <select id="selPeriodo">
        <option value="1">Periodo 1</option>
        <option value="2">Periodo 2</option>
        <option value="3">Periodo 3</option>
        <option value="4">Periodo 4</option>
      </select>
    </div>
  </div>

  <div class="escala-info" id="escalaInfo"></div>

  <div class="oficial-info" id="oficialInfo" style="display:none"></div>

  <button class="banco-toggle" id="btnBancoLogros">📋 Banco de logros de esta asignatura</button>

  <div class="aviso" id="avisoVacio">Selecciona un grado/grupo y una asignatura para empezar a registrar notas.</div>

  <div class="tabla-wrap" id="tablaWrap">
    <table>
      <thead>
        <tr>
          <th>Estudiante</th>
          <th>Nota</th>
          <th>Nivel</th>
          <th>Logro / Observación</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla"></tbody>
    </table>
  </div>

  <div class="footer-acciones" id="footerAcciones" style="display:none">
    <span class="contador" id="contadorGuardadas">0 notas registradas</span>
    <button class="btn-primario" id="btnGuardarTodas">Guardar todas las notas</button>
  </div>
</main>

<div id="modalBanco" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Banco de logros — <span id="bancoAsignaturaNombre"></span></h2>
      <button class="modal-close" id="btnCerrarBanco">&times;</button>
    </div>
    <div id="listaBancoLogros"></div>
    <button class="btn-plantillas-logro" id="btnPlantillasLogro">✨ Cargar plantillas genéricas de ejemplo</button>
    <button class="btn-plantillas-logro" id="btnLimpiarDuplicados" style="border-color:var(--rojo);color:var(--rojo)">🗑 Quitar logros duplicados</button>
    <div class="form-banco">
      <textarea id="nuevoLogroTexto" placeholder="Escribe un logro nuevo para guardar en el banco..."></textarea>
      <button class="btn-agregar-banco" id="btnAgregarLogroBanco">Agregar</button>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc, setDoc, addDoc, deleteDoc, collection, getDocs, query, where } from './firebase.js';

  let institucionId = null;
  let usuarioActual = null;
  let escalaCalificacion = null;
  let estudiantesCache = [];
  let asignaturasCache = [];
  let notasActuales = {}; // key: estudianteId -> {valor, guardado}
  let bancoLogrosCache = []; // [{id, texto}] de la asignatura actual
  let bancoOficialPorNivel = {}; // {Superior: texto, Alto: texto, Básico: texto, Bajo: texto} para el grado+asignatura actual

  // ── Banco oficial de logros (MEN) — normalización para hacer match con nombres libres ──
  const GRADOS_CANONICOS = {
    'primero': 'Primero', '1': 'Primero', '1°': 'Primero', '1o': 'Primero',
    'segundo': 'Segundo', '2': 'Segundo', '2°': 'Segundo', '2o': 'Segundo',
    'tercero': 'Tercero', '3': 'Tercero', '3°': 'Tercero', '3o': 'Tercero',
    'cuarto': 'Cuarto', '4': 'Cuarto', '4°': 'Cuarto', '4o': 'Cuarto',
    'quinto': 'Quinto', '5': 'Quinto', '5°': 'Quinto', '5o': 'Quinto',
    'sexto': 'Sexto', '6': 'Sexto', '6°': 'Sexto', '6o': 'Sexto',
    'septimo': 'Séptimo', '7': 'Séptimo', '7°': 'Séptimo', '7o': 'Séptimo',
    'octavo': 'Octavo', '8': 'Octavo', '8°': 'Octavo', '8o': 'Octavo',
    'noveno': 'Noveno', '9': 'Noveno', '9°': 'Noveno', '9o': 'Noveno',
    'decimo': 'Décimo', '10': 'Décimo', '10°': 'Décimo',
    'once': 'Once', '11': 'Once', '11°': 'Once',
  };
  const ASIGNATURAS_CANONICAS = [
    'Ciencias naturales y educación ambiental',
    'Ciencias sociales, historia, geografía, constitución política y democracia',
    'Educación artística y cultural',
    'Educación económica y financiera',
    'Educación física, recreación y deportes',
    'Educación religiosa',
    'Educación ética y en valores humanos',
    'Humanidades, lengua castellana e idiomas extranjeros',
    'Matemáticas',
    'Tecnología e informática',
  ];

  function normalizarTexto(s) {
    return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function gradoCanonico(gradoLibre) {
    const norm = normalizarTexto(gradoLibre).replace(/[^a-z0-9°]/g, ' ').trim();
    // probar el string completo y luego cada palabra/token
    if (GRADOS_CANONICOS[norm]) return GRADOS_CANONICOS[norm];
    const tokens = norm.split(/\s+/);
    for (const t of tokens) {
      if (GRADOS_CANONICOS[t]) return GRADOS_CANONICOS[t];
    }
    return null;
  }

  function asignaturaCanonica(nombreLibre) {
    const norm = normalizarTexto(nombreLibre);
    let mejor = null;
    for (const canon of ASIGNATURAS_CANONICAS) {
      const canonNorm = normalizarTexto(canon);
      if (norm === canonNorm || norm.includes(canonNorm) || canonNorm.includes(norm)) {
        return canon;
      }
    }
    // match parcial por palabra clave principal (primera palabra significativa)
    const primeraPalabra = norm.split(/\s+/)[0];
    if (primeraPalabra && primeraPalabra.length > 3) {
      for (const canon of ASIGNATURAS_CANONICAS) {
        if (normalizarTexto(canon).includes(primeraPalabra)) return canon;
      }
    }
    return mejor;
  }

  async function cargarBancoOficial() {
    bancoOficialPorNivel = {};
    const oficialInfo = document.getElementById('oficialInfo');
    const grado = document.getElementById('selGrado').value;
    const asignaturaId = document.getElementById('selAsignatura').value;
    if (!grado || !asignaturaId) { oficialInfo.style.display = 'none'; return; }

    const asigObj = asignaturasCache.find(a => a.id === asignaturaId);
    const gCanon = gradoCanonico(grado);
    const aCanon = asigObj ? asignaturaCanonica(asigObj.nombre) : null;

    if (!gCanon || !aCanon) { oficialInfo.style.display = 'none'; return; }

    try {
      const q = query(collection(db, 'banco_logros_oficial'), where('asignatura', '==', aCanon), where('grado', '==', gCanon));
      const snap = await getDocs(q);
      snap.forEach(d => {
        const data = d.data();
        bancoOficialPorNivel[data.nivel] = data.texto;
      });
      if (Object.keys(bancoOficialPorNivel).length > 0) {
        oficialInfo.style.display = 'block';
        oficialInfo.textContent = `✓ Banco oficial disponible para ${gCanon} — ${aCanon}. Al poner la nota, se sugiere automáticamente el logro según el nivel obtenido.`;
      } else {
        oficialInfo.style.display = 'none';
      }
    } catch (e) {
      console.warn('No se pudo cargar el banco oficial (puede que aún no se haya cargado):', e);
      oficialInfo.style.display = 'none';
    }
  }

  function primerNombre(nombres) {
    return (nombres || '').toString().trim().split(/\s+/)[0] || '';
  }

  function tituloCase(texto) {
    return (texto || '').toString().toLowerCase().replace(/(^|\s)([a-záéíóúñ])/g, (m, p1, p2) => p1 + p2.toUpperCase());
  }

  function nombreCompletoEstudiante(est) {
    const completo = `${est.nombres || ''} ${est.apellidos || ''}`.trim();
    return tituloCase(completo);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    const usuarioSnap = await getDoc(doc(db, 'usuarios', user.uid));
    if (!usuarioSnap.exists()) { window.location.href = 'index.html'; return; }
    usuarioActual = usuarioSnap.data();
    institucionId = usuarioActual.institucionId;

    const instSnap = await getDoc(doc(db, 'instituciones', institucionId));
    if (instSnap.exists()) {
      escalaCalificacion = instSnap.data().escalaCalificacion;
    }

    const [estSnap, asigSnap] = await Promise.all([
      getDocs(query(collection(db, 'estudiantes'), where('institucionId', '==', institucionId))),
      getDocs(query(collection(db, 'asignaturas'), where('institucionId', '==', institucionId))),
    ]);
    estSnap.forEach(d => estudiantesCache.push({ id: d.id, ...d.data() }));
    asigSnap.forEach(d => asignaturasCache.push({ id: d.id, ...d.data() }));

    llenarSelectGrados();
    mostrarInfoEscala();
  });

  function llenarSelectGrados() {
    const grados = [...new Set(estudiantesCache.map(e => e.grado).filter(Boolean))].sort();
    const sel = document.getElementById('selGrado');
    sel.innerHTML = '<option value="">Selecciona...</option>' + grados.map(g => `<option value="${g}">${g}</option>`).join('');
  }

  function mostrarInfoEscala() {
    const info = document.getElementById('escalaInfo');
    if (!escalaCalificacion || !escalaCalificacion.niveles) return;
    const partes = escalaCalificacion.niveles.map(n => `<b>${n.nombre}</b>: ${n.min}-${n.max}`).join('  ·  ');
    info.innerHTML = `Escala de tu institución — ${partes}`;
    info.classList.add('visible');
  }

  document.getElementById('selGrado').addEventListener('change', () => {
    const grado = document.getElementById('selGrado').value;
    const selAsig = document.getElementById('selAsignatura');
    if (!grado) {
      selAsig.innerHTML = '<option value="">Selecciona un grado primero</option>';
      renderTabla();
      return;
    }
    const asignaturasDelGrado = asignaturasCache.filter(a => !a.grado || a.grado === grado);
    if (asignaturasDelGrado.length === 0) {
      selAsig.innerHTML = '<option value="">No hay asignaturas para este grado</option>';
    } else {
      selAsig.innerHTML = '<option value="">Selecciona...</option>' +
        asignaturasDelGrado.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('');
    }
    renderTabla();
  });

  document.getElementById('selAsignatura').addEventListener('change', async () => {
    await cargarBancoLogros();
    await cargarBancoOficial();
    await cargarNotasExistentes();
  });

  async function cargarBancoLogros() {
    const asignaturaId = document.getElementById('selAsignatura').value;
    const btnBanco = document.getElementById('btnBancoLogros');
    if (!asignaturaId) {
      btnBanco.classList.remove('visible');
      bancoLogrosCache = [];
      return;
    }
    btnBanco.classList.add('visible');
    const q = query(collection(db, 'banco_logros'), where('institucionId', '==', institucionId), where('asignaturaId', '==', asignaturaId));
    const snap = await getDocs(q);
    bancoLogrosCache = [];
    snap.forEach(d => bancoLogrosCache.push({ id: d.id, texto: d.data().texto }));
  }

  document.getElementById('btnBancoLogros').addEventListener('click', () => {
    const selAsig = document.getElementById('selAsignatura');
    document.getElementById('bancoAsignaturaNombre').textContent = selAsig.options[selAsig.selectedIndex]?.text || '';
    renderListaBanco();
    document.getElementById('modalBanco').style.display = 'flex';
  });
  document.getElementById('btnCerrarBanco').addEventListener('click', () => { document.getElementById('modalBanco').style.display = 'none'; });
  document.getElementById('modalBanco').addEventListener('click', (e) => { if (e.target.id === 'modalBanco') document.getElementById('modalBanco').style.display = 'none'; });

  function renderListaBanco() {
    const lista = document.getElementById('listaBancoLogros');
    if (bancoLogrosCache.length === 0) {
      lista.innerHTML = '<p style="font-size:0.82rem;color:var(--texto-light);text-align:center;padding:1rem 0">Todavía no hay logros guardados para esta asignatura.</p>';
      return;
    }
    lista.innerHTML = bancoLogrosCache.map(l => `
      <div class="banco-item">
        <span>${l.texto}</span>
        <button class="banco-item-quitar" onclick="quitarLogroBanco('${l.id}')" title="Quitar del banco">&times;</button>
      </div>
    `).join('');
  }

  document.getElementById('btnAgregarLogroBanco').addEventListener('click', async () => {
    const textarea = document.getElementById('nuevoLogroTexto');
    const texto = textarea.value.trim();
    const asignaturaId = document.getElementById('selAsignatura').value;
    if (!texto || !asignaturaId) return;
    try {
      await addDoc(collection(db, 'banco_logros'), { institucionId, asignaturaId, texto });
      textarea.value = '';
      await cargarBancoLogros();
      renderListaBanco();
      actualizarSelectsDeLogro();
    } catch (err) {
      alert('No se pudo guardar el logro.');
      console.error(err);
    }
  });

  const PLANTILLAS_LOGROS = [
    'Identifica y comprende los conceptos básicos trabajados durante el periodo.',
    'Aplica los conocimientos adquiridos en situaciones prácticas y cotidianas.',
    'Participa activamente en las actividades propuestas en clase.',
    'Demuestra responsabilidad y compromiso con las tareas y compromisos asignados.',
    'Presenta dificultades para alcanzar los logros propuestos; requiere refuerzo y acompañamiento adicional.',
  ];

  document.getElementById('btnPlantillasLogro').addEventListener('click', async () => {
    const asignaturaId = document.getElementById('selAsignatura').value;
    if (!asignaturaId) return;
    if (!confirm('Se van a agregar 5 frases genéricas de ejemplo al banco de esta asignatura, para que las edites a tu gusto. ¿Continuar?')) return;
    try {
      await Promise.all(PLANTILLAS_LOGROS.map(texto => addDoc(collection(db, 'banco_logros'), { institucionId, asignaturaId, texto })));
      await cargarBancoLogros();
      renderListaBanco();
      actualizarSelectsDeLogro();
    } catch (err) {
      alert('No se pudieron cargar las plantillas.');
      console.error(err);
    }
  });

  function actualizarSelectsDeLogro() {
    document.querySelectorAll('.select-logro-banco').forEach(sel => {
      sel.innerHTML = '<option value="">Elegir del banco...</option>' +
        bancoLogrosCache.map(l => `<option value="${l.texto.replace(/"/g,'&quot;')}">${l.texto.substring(0,60)}${l.texto.length>60?'...':''}</option>`).join('');
    });
  }

  document.getElementById('btnLimpiarDuplicados').addEventListener('click', async () => {
    const vistos = new Set();
    const paraBorrar = [];
    bancoLogrosCache.forEach(l => {
      if (vistos.has(l.texto)) paraBorrar.push(l.id);
      else vistos.add(l.texto);
    });
    if (paraBorrar.length === 0) { alert('No hay logros duplicados en esta asignatura.'); return; }
    if (!confirm(`Se van a borrar ${paraBorrar.length} logros repetidos, dejando solo una copia de cada uno. ¿Continuar?`)) return;
    try {
      await Promise.all(paraBorrar.map(id => deleteDoc(doc(db, 'banco_logros', id))));
      await cargarBancoLogros();
      renderListaBanco();
      actualizarSelectsDeLogro();
      alert(`✓ Se quitaron ${paraBorrar.length} duplicados.`);
    } catch (err) {
      alert('No se pudieron quitar los duplicados.');
      console.error(err);
    }
  });

  window.quitarLogroBanco = async function(id) {
    try {
      await deleteDoc(doc(db, 'banco_logros', id));
      await cargarBancoLogros();
      renderListaBanco();
    } catch (err) {
      alert('No se pudo quitar.');
      console.error(err);
    }
  };

  window.aplicarLogroBanco = function(estudianteId, selectEl) {
    if (!selectEl.value) return;
    document.getElementById(`logro-${estudianteId}`).value = selectEl.value;
    selectEl.value = '';
  };
  document.getElementById('selPeriodo').addEventListener('change', cargarNotasExistentes);

  function nivelDeNota(valor) {
    if (!escalaCalificacion || !escalaCalificacion.niveles || valor === null || valor === '' || isNaN(valor)) return null;
    const v = parseFloat(valor);
    return escalaCalificacion.niveles.find(n => v >= n.min && v <= n.max) || null;
  }

  function colorNivel(nombre) {
    const mapa = {
      'Superior': { bg: 'var(--verde-light)', c: 'var(--verde)' },
      'Alto': { bg: 'var(--azul-light)', c: 'var(--azul)' },
      'Básico': { bg: 'var(--amarillo-light)', c: 'var(--amarillo)' },
      'Bajo': { bg: 'var(--rojo-light)', c: 'var(--rojo)' },
      'Aprobado': { bg: 'var(--verde-light)', c: 'var(--verde)' },
      'Reprobado': { bg: 'var(--rojo-light)', c: 'var(--rojo)' },
    };
    return mapa[nombre] || { bg: 'var(--gris)', c: 'var(--texto-mid)' };
  }

  async function cargarNotasExistentes() {
    renderTabla();
    const grado = document.getElementById('selGrado').value;
    const asignaturaId = document.getElementById('selAsignatura').value;
    const periodo = document.getElementById('selPeriodo').value;
    if (!grado || !asignaturaId) return;

    const estudiantesDelGrado = estudiantesCache.filter(e => e.grado === grado);
    notasActuales = {};

    for (const est of estudiantesDelGrado) {
      const notaId = `${est.id}_${asignaturaId}_${periodo}`;
      try {
        const notaSnap = await getDoc(doc(db, 'notas', notaId));
        if (notaSnap.exists()) {
          notasActuales[est.id] = { valor: notaSnap.data().valorNumerico, logro: notaSnap.data().logro || '', guardado: true };
        }
      } catch (e) { /* no existe todavía, se ignora */ }
    }
    renderTabla();
  }

  function renderTabla() {
    const grado = document.getElementById('selGrado').value;
    const asignaturaId = document.getElementById('selAsignatura').value;
    const aviso = document.getElementById('avisoVacio');
    const tablaWrap = document.getElementById('tablaWrap');
    const footer = document.getElementById('footerAcciones');

    if (!grado || !asignaturaId) {
      aviso.style.display = 'block';
      tablaWrap.classList.remove('visible');
      footer.style.display = 'none';
      return;
    }

    const estudiantesDelGrado = estudiantesCache
      .filter(e => e.grado === grado)
      .sort((a, b) => (a.apellidos || '').localeCompare(b.apellidos || ''));

    if (estudiantesDelGrado.length === 0) {
      aviso.textContent = 'No hay estudiantes registrados en este grado/grupo todavía.';
      aviso.style.display = 'block';
      tablaWrap.classList.remove('visible');
      footer.style.display = 'none';
      return;
    }

    aviso.style.display = 'none';
    tablaWrap.classList.add('visible');
    footer.style.display = 'flex';

    const cuerpo = document.getElementById('cuerpoTabla');
    const min = escalaCalificacion && escalaCalificacion.niveles ? Math.min(...escalaCalificacion.niveles.map(n => n.min)) : 0;
    const max = escalaCalificacion && escalaCalificacion.niveles ? Math.max(...escalaCalificacion.niveles.map(n => n.max)) : 5;

    cuerpo.innerHTML = estudiantesDelGrado.map(est => {
      const notaInfo = notasActuales[est.id];
      const valor = notaInfo ? notaInfo.valor : '';
      const logro = notaInfo ? (notaInfo.logro || '') : '';
      const guardado = notaInfo ? notaInfo.guardado : false;
      const nivel = nivelDeNota(valor);
      const nivelHtml = nivel
        ? `<span class="nivel-chip" style="background:${colorNivel(nivel.nombre).bg};color:${colorNivel(nivel.nombre).c}" id="nivel-${est.id}">${nivel.nombre}</span>`
        : `<span class="nivel-vacio" id="nivel-${est.id}">—</span>`;

      return `
        <tr>
          <td><b>${est.apellidos}</b> ${est.nombres}</td>
          <td><input type="number" class="input-nota" id="nota-${est.id}" min="${min}" max="${max}" step="0.1" value="${valor}" oninput="actualizarNivel('${est.id}')"/></td>
          <td>${nivelHtml}</td>
          <td>
            <select class="select-logro-banco" onchange="aplicarLogroBanco('${est.id}', this)">
              <option value="">Elegir del banco...</option>
              ${bancoLogrosCache.map(l => `<option value="${l.texto.replace(/"/g,'&quot;')}">${l.texto.substring(0,60)}${l.texto.length>60?'...':''}</option>`).join('')}
            </select>
            <textarea class="input-logro" id="logro-${est.id}" placeholder="Ej: Reconoce y aplica las operaciones básicas con seguridad.">${logro}</textarea>
            <div id="sugerido-${est.id}"></div>
          </td>
          <td><span class="estado-guardado" id="estado-${est.id}">${guardado ? '✓ Guardado' : ''}</span></td>
        </tr>
      `;
    }).join('');

    actualizarContador();
    estudiantesDelGrado.forEach(est => actualizarSugerencia(est.id, est, notaInfoInicial(est.id)));
  }

  function notaInfoInicial(estudianteId) {
    return notasActuales[estudianteId] ? notasActuales[estudianteId].valor : '';
  }

  function actualizarSugerencia(estudianteId, estudianteObj, valorNota) {
    const cont = document.getElementById(`sugerido-${estudianteId}`);
    if (!cont) return;
    const nivel = nivelDeNota(valorNota);
    if (!nivel || !bancoOficialPorNivel[nivel.nombre]) { cont.innerHTML = ''; return; }
    const nombreParaTexto = estudianteObj ? nombreCompletoEstudiante(estudianteObj) : '';
    const textoSugerido = bancoOficialPorNivel[nivel.nombre].replace('[Nombre_Estudiante]', nombreParaTexto);
    const textarea = document.getElementById(`logro-${estudianteId}`);
    if (textarea && !textarea.value.trim()) {
      textarea.value = textoSugerido;
    }
    cont.innerHTML = `<button type="button" class="btn-sugerido" onclick="usarSugerido('${estudianteId}')">💡 Usar sugerencia oficial (${nivel.nombre})</button>`;
    cont.dataset.textoSugerido = textoSugerido;
  }

  window.usarSugerido = function(estudianteId) {
    const cont = document.getElementById(`sugerido-${estudianteId}`);
    const textarea = document.getElementById(`logro-${estudianteId}`);
    if (cont && textarea && cont.dataset.textoSugerido) {
      textarea.value = cont.dataset.textoSugerido;
    }
  };

  window.actualizarNivel = function(estudianteId) {
    const input = document.getElementById(`nota-${estudianteId}`);
    const nivelEl = document.getElementById(`nivel-${estudianteId}`);
    const estadoEl = document.getElementById(`estado-${estudianteId}`);
    const nivel = nivelDeNota(input.value);
    if (nivel) {
      const colores = colorNivel(nivel.nombre);
      nivelEl.outerHTML = `<span class="nivel-chip" style="background:${colores.bg};color:${colores.c}" id="nivel-${estudianteId}">${nivel.nombre}</span>`;
    } else {
      nivelEl.outerHTML = `<span class="nivel-vacio" id="nivel-${estudianteId}">—</span>`;
    }
    estadoEl.textContent = '';
    estadoEl.style.color = 'var(--texto-light)';
    const est = estudiantesCache.find(e => e.id === estudianteId);
    actualizarSugerencia(estudianteId, est, input.value);
  };

  function actualizarContador() {
    const grado = document.getElementById('selGrado').value;
    const total = estudiantesCache.filter(e => e.grado === grado).length;
    const conNota = Object.keys(notasActuales).filter(k => notasActuales[k].guardado).length;
    document.getElementById('contadorGuardadas').textContent = `${conNota} de ${total} notas registradas`;
  }

  document.getElementById('btnGuardarTodas').addEventListener('click', async () => {
    const grado = document.getElementById('selGrado').value;
    const asignaturaId = document.getElementById('selAsignatura').value;
    const periodo = document.getElementById('selPeriodo').value;
    const btn = document.getElementById('btnGuardarTodas');
    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const estudiantesDelGrado = estudiantesCache.filter(e => e.grado === grado);
    let guardadas = 0;

    for (const est of estudiantesDelGrado) {
      const input = document.getElementById(`nota-${est.id}`);
      const logroInput = document.getElementById(`logro-${est.id}`);
      if (!input || input.value === '') continue;
      const valor = parseFloat(input.value);
      const logro = logroInput ? logroInput.value.trim() : '';
      const notaId = `${est.id}_${asignaturaId}_${periodo}`;
      const nivel = nivelDeNota(valor);
      try {
        await setDoc(doc(db, 'notas', notaId), {
          institucionId,
          estudianteId: est.id,
          asignaturaId,
          periodo: parseInt(periodo, 10),
          valorNumerico: valor,
          valorCualitativo: nivel ? nivel.nombre : null,
          logro: logro,
          docenteId: auth.currentUser.uid,
          fechaActualizacion: new Date().toISOString(),
        });
        notasActuales[est.id] = { valor, logro, guardado: true };
        const estadoEl = document.getElementById(`estado-${est.id}`);
        if (estadoEl) { estadoEl.textContent = '✓ Guardado'; estadoEl.style.color = 'var(--verde)'; }
        guardadas++;
      } catch (err) {
        console.error(`Error guardando nota de ${est.nombres}:`, err);
      }
    }

    actualizarContador();
    btn.disabled = false;
    btn.textContent = 'Guardar todas las notas';
    alert(`✓ Se guardaron ${guardadas} notas correctamente.`);
  });

  document.getElementById('btnSalir').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
