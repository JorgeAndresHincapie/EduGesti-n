<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduGestión — Asignaturas</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1A4F8A; --azul-dark: #123769; --azul-light: #EBF2FB;
  --morado: #553C9A; --morado-light: #F0EBFF;
  --gris: #F4F6F9; --borde: #DDE3EC;
  --texto: #1A2332; --texto-mid: #4A5568; --texto-light: #8896A7;
  --blanco: #FFFFFF; --rojo: #C53030; --rojo-light: #FFF5F5;
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

.topbar { background: var(--azul); height: 58px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 0.9rem; }
.topbar-back { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.85; }
.topbar-back:hover { opacity: 1; }
.topbar-brand { font-size: 1.0rem; font-weight: 700; color: white; }
.btn-salir { background: rgba(255,255,255,0.12); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }

.main { max-width: 900px; margin: 0 auto; padding: 2.2rem 2rem 4rem; }
.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; flex-wrap: wrap; gap: 1rem; }
.titulo { font-family: 'Instrument Serif', serif; font-size: 1.8rem; }
.btn-primario { background: var(--azul); color: white; border: none; padding: 0.65rem 1.2rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
.btn-primario:hover { background: var(--azul-dark); }
.btn-secundario { background: var(--morado-light); color: var(--morado); border: 1.5px solid var(--morado); padding: 0.6rem 1.1rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
.btn-secundario:hover { background: var(--morado); color: white; }
.btn-secundario:disabled { opacity: 0.6; cursor: default; }

.tabla-wrap { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-light); padding: 0.8rem 1rem; background: var(--gris); border-bottom: 1.5px solid var(--borde); }
td { padding: 0.8rem 1rem; font-size: 0.85rem; border-bottom: 1px solid var(--borde); }
tr:last-child td { border-bottom: none; }
.chip { display: inline-block; background: var(--morado-light); color: var(--morado); font-size: 0.72rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 10px; }
.acciones-td { display: flex; gap: 0.5rem; }
.btn-icon { background: none; border: none; cursor: pointer; color: var(--texto-light); padding: 0.3rem; border-radius: 6px; }
.btn-icon:hover { background: var(--gris); color: var(--texto); }
.btn-icon.danger:hover { color: var(--rojo); background: var(--rojo-light); }
.btn-icon svg { width: 16px; height: 16px; }
.vacio { text-align: center; padding: 3rem 1rem; color: var(--texto-light); font-size: 0.85rem; }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,25,35,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
.modal-box { background: var(--blanco); border-radius: 14px; width: 100%; max-width: 420px; padding: 1.6rem; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.modal-header h2 { font-family: 'Instrument Serif', serif; font-size: 1.3rem; }
.modal-close { background: none; border: none; font-size: 1.6rem; color: var(--texto-light); cursor: pointer; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--texto-mid); margin-bottom: 0.35rem; }
.field input { width: 100%; padding: 0.6rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.85rem; }
.field input:focus { outline: none; border-color: var(--azul); }
.field-hint { display: block; font-size: 0.7rem; color: var(--texto-light); margin-top: 0.3rem; }
.btn-guardar { width: 100%; background: var(--azul); color: white; border: none; border-radius: 9px; font-weight: 700; font-size: 0.88rem; padding: 0.75rem; cursor: pointer; margin-top: 0.3rem; font-family: inherit; }
.btn-guardar:disabled { opacity: 0.6; }
.msg { display: none; font-size: 0.8rem; padding: 0.6rem 0.8rem; border-radius: 8px; margin-bottom: 0.8rem; }
.msg.visible { display: block; }
.msg-err { background: var(--rojo-light); color: var(--rojo); }
.loading-wrap { text-align: center; padding: 2rem; color: var(--texto-light); font-size: 0.85rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="dashboard.html" class="topbar-back">← Panel</a>
    <span class="topbar-brand">Asignaturas</span>
  </div>
  <button class="btn-salir" id="btnSalir">Salir</button>
</header>

<main class="main">
  <div class="header-row">
    <p class="titulo">Asignaturas</p>
    <div style="display:flex;gap:0.6rem;flex-wrap:wrap">
      <button class="btn-secundario" id="btnCargarObligatorias">Cargar áreas obligatorias (Ley 115)</button>
      <button class="btn-primario" id="btnNuevo">+ Agregar asignatura</button>
    </div>
  </div>

  <div class="tabla-wrap">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Grado / Grupo</th>
          <th>Docente</th>
          <th>Intensidad (h/sem)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla">
        <tr><td colspan="5" class="loading-wrap">Cargando asignaturas...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div id="modalAsignatura" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitulo">Agregar asignatura</h2>
      <button class="modal-close" id="btnCerrarModal">&times;</button>
    </div>
    <form id="formAsignatura">
      <input type="hidden" id="asignaturaId"/>
      <div class="field">
        <label>Nombre de la asignatura</label>
        <input type="text" id="fNombre" placeholder="Ej: Matemáticas, Electricidad Básica" required/>
      </div>
      <div class="field">
        <label>Grado / Grupo al que aplica</label>
        <input type="text" id="fGrado" placeholder="Ej: 5° A, o déjalo vacío si aplica a todos" />
        <span class="field-hint">Debe escribirse igual a como está en Estudiantes (ej. "5° A"). Vacío = aplica a todos los grados.</span>
      </div>
      <div class="field">
        <label>Docente asignado (opcional por ahora)</label>
        <input type="text" id="fDocente" placeholder="Nombre del docente"/>
      </div>
      <div class="field">
        <label>Intensidad horaria semanal (opcional)</label>
        <input type="number" id="fIntensidad" min="0" placeholder="Ej: 4"/>
      </div>
      <div class="msg msg-err" id="msgErr"><span id="msgErrTexto"></span></div>
      <button type="submit" class="btn-guardar" id="btnGuardar">Guardar</button>
    </form>
  </div>
</div>

<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc, updateDoc, deleteDoc, collection, addDoc, getDocs, query, where, serverTimestamp } from './firebase.js';

  let institucionId = null;
  let usuarioActual = null;
  let asignaturasCache = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    const usuarioSnap = await getDoc(doc(db, 'usuarios', user.uid));
    if (!usuarioSnap.exists()) { window.location.href = 'index.html'; return; }
    usuarioActual = usuarioSnap.data();
    institucionId = usuarioActual.institucionId;
    await cargarAsignaturas();
  });

  async function cargarAsignaturas() {
    const q = query(collection(db, 'asignaturas'), where('institucionId', '==', institucionId));
    const snap = await getDocs(q);
    asignaturasCache = [];
    snap.forEach(d => asignaturasCache.push({ id: d.id, ...d.data() }));
    asignaturasCache.sort((a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
    renderTabla();
  }

  function renderTabla() {
    const cuerpo = document.getElementById('cuerpoTabla');
    if (asignaturasCache.length === 0) {
      cuerpo.innerHTML = `<tr><td colspan="5" class="vacio">Todavía no has agregado asignaturas.</td></tr>`;
      return;
    }
    cuerpo.innerHTML = asignaturasCache.map(a => `
      <tr>
        <td><b>${a.nombre}</b></td>
        <td>${a.grado ? `<span class="chip">${a.grado}</span>` : '<span style="color:var(--texto-light)">Todos los grados</span>'}</td>
        <td>${a.docente || '<span style="color:var(--texto-light)">Sin asignar</span>'}</td>
        <td>${a.intensidad != null && a.intensidad !== '' ? a.intensidad : '—'}</td>
        <td>
          <div class="acciones-td">
            <button class="btn-icon" onclick="editarAsignatura('${a.id}')" title="Editar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            </button>
            <button class="btn-icon danger" onclick="eliminarAsignatura('${a.id}')" title="Eliminar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  const modal = document.getElementById('modalAsignatura');
  const form = document.getElementById('formAsignatura');
  const msgErr = document.getElementById('msgErr');

  function abrirModal(asignatura = null) {
    form.reset();
    msgErr.classList.remove('visible');
    if (asignatura) {
      document.getElementById('modalTitulo').textContent = 'Editar asignatura';
      document.getElementById('asignaturaId').value = asignatura.id;
      document.getElementById('fNombre').value = asignatura.nombre || '';
      document.getElementById('fGrado').value = asignatura.grado || '';
      document.getElementById('fDocente').value = asignatura.docente || '';
      document.getElementById('fIntensidad').value = asignatura.intensidad != null ? asignatura.intensidad : '';
    } else {
      document.getElementById('modalTitulo').textContent = 'Agregar asignatura';
      document.getElementById('asignaturaId').value = '';
    }
    modal.style.display = 'flex';
  }

  document.getElementById('btnNuevo').addEventListener('click', () => abrirModal());
  document.getElementById('btnCerrarModal').addEventListener('click', () => { modal.style.display = 'none'; });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

  const AREAS_BASICA_LEY115 = [
    'Ciencias naturales y educación ambiental',
    'Ciencias sociales, historia, geografía, constitución política y democracia',
    'Educación artística y cultural',
    'Educación ética y en valores humanos',
    'Educación física, recreación y deportes',
    'Educación religiosa',
    'Humanidades, lengua castellana e idiomas extranjeros',
    'Matemáticas',
    'Tecnología e informática',
    'Educación económica y financiera',
  ];
  const AREAS_MEDIA_ADICIONALES = ['Filosofía', 'Ciencias económicas y políticas'];

  document.getElementById('btnCargarObligatorias').addEventListener('click', async () => {
    const incluirMedia = confirm(
      'Se van a crear las 10 áreas obligatorias de la Ley 115 (para todos los grados).\n\n' +
      '¿Agregar también las 2 áreas adicionales de Educación Media (Filosofía y Ciencias económicas y políticas), aplicadas a 10° y 11°?'
    );
    const btn = document.getElementById('btnCargarObligatorias');
    btn.disabled = true;
    btn.textContent = 'Cargando...';

    try {
      const existentes = new Set(asignaturasCache.map(a => `${a.nombre}|${a.grado || ''}`));
      const porCrear = [];

      AREAS_BASICA_LEY115.forEach(nombre => {
        if (!existentes.has(`${nombre}|`)) {
          porCrear.push({ institucionId, nombre, grado: '', docente: '', intensidad: null, creadoPor: auth.currentUser.uid, fechaCreacion: serverTimestamp() });
        }
      });

      if (incluirMedia) {
        AREAS_MEDIA_ADICIONALES.forEach(nombre => {
          ['10°', '11°'].forEach(grado => {
            if (!existentes.has(`${nombre}|${grado}`)) {
              porCrear.push({ institucionId, nombre, grado, docente: '', intensidad: null, creadoPor: auth.currentUser.uid, fechaCreacion: serverTimestamp() });
            }
          });
        });
      }

      if (porCrear.length === 0) {
        alert('Ya tienes cargadas todas estas áreas — no se creó ninguna duplicada.');
      } else {
        await Promise.all(porCrear.map(datos => addDoc(collection(db, 'asignaturas'), datos)));
        await cargarAsignaturas();
        alert(`✓ Se cargaron ${porCrear.length} áreas obligatorias correctamente.`);
      }
    } catch (err) {
      alert('No se pudieron cargar las áreas. Intenta de nuevo.');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Cargar áreas obligatorias (Ley 115)';
    }
  });
  window.editarAsignatura = function(id) {
    const a = asignaturasCache.find(x => x.id === id);
    if (a) abrirModal(a);
  };

  window.eliminarAsignatura = async function(id) {
    if (!confirm('¿Seguro que quieres eliminar esta asignatura?')) return;
    try {
      await deleteDoc(doc(db, 'asignaturas', id));
      await cargarAsignaturas();
    } catch (err) {
      alert('No se pudo eliminar. Intenta de nuevo.');
      console.error(err);
    }
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    msgErr.classList.remove('visible');

    const id = document.getElementById('asignaturaId').value;
    const intensidadVal = document.getElementById('fIntensidad').value;
    const datos = {
      institucionId,
      nombre: document.getElementById('fNombre').value.trim(),
      grado: document.getElementById('fGrado').value.trim(),
      docente: document.getElementById('fDocente').value.trim(),
      intensidad: intensidadVal === '' ? null : parseInt(intensidadVal, 10),
    };

    try {
      if (id) {
        await updateDoc(doc(db, 'asignaturas', id), datos);
      } else {
        datos.creadoPor = auth.currentUser.uid;
        datos.fechaCreacion = serverTimestamp();
        await addDoc(collection(db, 'asignaturas'), datos);
      }
      modal.style.display = 'none';
      await cargarAsignaturas();
    } catch (err) {
      msgErr.querySelector('#msgErrTexto').textContent = 'No se pudo guardar. Intenta de nuevo.';
      msgErr.classList.add('visible');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar';
    }
  });

  document.getElementById('btnSalir').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
