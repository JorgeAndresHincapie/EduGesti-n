<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduGestión — Estudiantes</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1A4F8A; --azul-dark: #123769; --azul-light: #EBF2FB;
  --verde: #1A7A5E; --verde-light: #E8F5F0;
  --gris: #F4F6F9; --borde: #DDE3EC;
  --texto: #1A2332; --texto-mid: #4A5568; --texto-light: #8896A7;
  --blanco: #FFFFFF; --rojo: #C53030; --rojo-light: #FFF5F5;
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

.topbar { background: var(--azul); height: 58px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 0.9rem; }
.topbar-back { color: white; text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 0.3rem; opacity: 0.85; }
.topbar-back:hover { opacity: 1; }
.topbar-brand { font-size: 1.0rem; font-weight: 700; color: white; }
.btn-salir { background: rgba(255,255,255,0.12); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }

.main { max-width: 1000px; margin: 0 auto; padding: 2.2rem 2rem 4rem; }
.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.6rem; flex-wrap: wrap; gap: 1rem; }
.titulo { font-family: 'Instrument Serif', serif; font-size: 1.8rem; }
.btn-primario { background: var(--azul); color: white; border: none; padding: 0.65rem 1.2rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 0.4rem; }
.btn-primario:hover { background: var(--azul-dark); }

.filtros { display: flex; gap: 0.7rem; margin-bottom: 1.3rem; flex-wrap: wrap; }
.filtros input, .filtros select { padding: 0.55rem 0.8rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.82rem; background: white; }
.filtros input { flex: 1; min-width: 180px; }

.tabla-wrap { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-light); padding: 0.8rem 1rem; background: var(--gris); border-bottom: 1.5px solid var(--borde); }
td { padding: 0.8rem 1rem; font-size: 0.85rem; border-bottom: 1px solid var(--borde); }
tr:last-child td { border-bottom: none; }
.chip { display: inline-block; background: var(--azul-light); color: var(--azul); font-size: 0.72rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 10px; }
.acciones-td { display: flex; gap: 0.5rem; }
.btn-icon { background: none; border: none; cursor: pointer; color: var(--texto-light); padding: 0.3rem; border-radius: 6px; }
.btn-icon:hover { background: var(--gris); color: var(--texto); }
.btn-icon.danger:hover { color: var(--rojo); background: var(--rojo-light); }
.btn-icon svg { width: 16px; height: 16px; }
.vacio { text-align: center; padding: 3rem 1rem; color: var(--texto-light); font-size: 0.85rem; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(20,25,35,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
.modal-box { background: var(--blanco); border-radius: 14px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; padding: 1.6rem; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.modal-header h2 { font-family: 'Instrument Serif', serif; font-size: 1.3rem; }
.modal-close { background: none; border: none; font-size: 1.6rem; color: var(--texto-light); cursor: pointer; }
.field-row { display: flex; gap: 0.8rem; }
.field-row .field { flex: 1; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--texto-mid); margin-bottom: 0.35rem; }
.field input, .field select { width: 100%; padding: 0.6rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.85rem; }
.field input:focus, .field select:focus { outline: none; border-color: var(--azul); }
.btn-guardar { width: 100%; background: var(--azul); color: white; border: none; border-radius: 9px; font-weight: 700; font-size: 0.88rem; padding: 0.75rem; cursor: pointer; margin-top: 0.3rem; font-family: inherit; }
.btn-guardar:disabled { opacity: 0.6; }
.msg { display: none; font-size: 0.8rem; padding: 0.6rem 0.8rem; border-radius: 8px; margin-bottom: 0.8rem; }
.msg.visible { display: block; }
.msg-err { background: var(--rojo-light); color: var(--rojo); }
.loading-wrap { text-align: center; padding: 2rem; color: var(--texto-light); font-size: 0.85rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="dashboard.html" class="topbar-back">← Panel</a>
    <span class="topbar-brand">Estudiantes</span>
  </div>
  <button class="btn-salir" id="btnSalir">Salir</button>
</header>

<main class="main">
  <div class="header-row">
    <p class="titulo">Estudiantes</p>
    <button class="btn-primario" id="btnNuevo">+ Agregar estudiante</button>
  </div>

  <div class="filtros">
    <input type="text" id="filtroTexto" placeholder="Buscar por nombre o documento..."/>
    <select id="filtroGrado"><option value="">Todos los grados/grupos</option></select>
  </div>

  <div class="tabla-wrap">
    <table id="tablaEstudiantes">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Documento</th>
          <th>Grado / Grupo</th>
          <th>Acudiente</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cuerpoTabla">
        <tr><td colspan="5" class="loading-wrap">Cargando estudiantes...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Modal Agregar/Editar Estudiante -->
<div id="modalEstudiante" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitulo">Agregar estudiante</h2>
      <button class="modal-close" id="btnCerrarModal">&times;</button>
    </div>
    <form id="formEstudiante">
      <input type="hidden" id="estudianteId"/>
      <div class="field-row">
        <div class="field"><label>Nombres</label><input type="text" id="fNombres" required/></div>
        <div class="field"><label>Apellidos</label><input type="text" id="fApellidos" required/></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Tipo de documento</label>
          <select id="fTipoDoc">
            <option value="RC">Registro civil</option>
            <option value="TI">Tarjeta de identidad</option>
            <option value="CC">Cédula de ciudadanía</option>
            <option value="CE">Cédula de extranjería</option>
          </select>
        </div>
        <div class="field"><label>Número de documento</label><input type="text" id="fDocumento" required/></div>
      </div>
      <div class="field">
        <label>Grado / Grupo</label>
        <input type="text" id="fGrado" placeholder="Ej: 5° A, o Curso Sistemas 2026-1" required/>
      </div>
      <div class="field-row">
        <div class="field"><label>Nombre del acudiente</label><input type="text" id="fAcudiente"/></div>
        <div class="field"><label>Teléfono del acudiente</label><input type="text" id="fTelefonoAcudiente"/></div>
      </div>
      <div class="msg msg-err" id="msgErr"><span id="msgErrTexto"></span></div>
      <button type="submit" class="btn-guardar" id="btnGuardar">Guardar</button>
    </form>
  </div>
</div>

<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, addDoc, getDocs, query, where, serverTimestamp } from './firebase.js';

  let institucionId = null;
  let usuarioActual = null;
  let estudiantesCache = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    const usuarioSnap = await getDoc(doc(db, 'usuarios', user.uid));
    if (!usuarioSnap.exists()) { window.location.href = 'index.html'; return; }
    usuarioActual = usuarioSnap.data();
    institucionId = usuarioActual.institucionId;
    await cargarEstudiantes();
  });

  async function cargarEstudiantes() {
    const q = query(collection(db, 'estudiantes'), where('institucionId', '==', institucionId));
    const snap = await getDocs(q);
    estudiantesCache = [];
    snap.forEach(d => estudiantesCache.push({ id: d.id, ...d.data() }));
    estudiantesCache.sort((a, b) => (a.apellidos || '').localeCompare(b.apellidos || ''));
    renderTabla();
    renderFiltroGrados();
  }

  function renderFiltroGrados() {
    const select = document.getElementById('filtroGrado');
    const gradosUnicos = [...new Set(estudiantesCache.map(e => e.grado).filter(Boolean))].sort();
    const valorActual = select.value;
    select.innerHTML = '<option value="">Todos los grados/grupos</option>' +
      gradosUnicos.map(g => `<option value="${g}">${g}</option>`).join('');
    select.value = valorActual;
  }

  function renderTabla() {
    const filtroTexto = document.getElementById('filtroTexto').value.trim().toLowerCase();
    const filtroGrado = document.getElementById('filtroGrado').value;
    const cuerpo = document.getElementById('cuerpoTabla');

    const filtrados = estudiantesCache.filter(e => {
      const nombreCompleto = `${e.nombres} ${e.apellidos}`.toLowerCase();
      const coincideTexto = !filtroTexto || nombreCompleto.includes(filtroTexto) || (e.documento || '').includes(filtroTexto);
      const coincideGrado = !filtroGrado || e.grado === filtroGrado;
      return coincideTexto && coincideGrado;
    });

    if (filtrados.length === 0) {
      cuerpo.innerHTML = `<tr><td colspan="5" class="vacio">${estudiantesCache.length === 0 ? 'Todavía no has agregado estudiantes.' : 'No se encontraron estudiantes con ese filtro.'}</td></tr>`;
      return;
    }

    cuerpo.innerHTML = filtrados.map(e => `
      <tr>
        <td><b>${e.apellidos}</b> ${e.nombres}</td>
        <td>${e.tipoDoc || ''} ${e.documento || ''}</td>
        <td><span class="chip">${e.grado || '—'}</span></td>
        <td>${e.acudiente || '<span style="color:var(--texto-light)">Sin registrar</span>'}</td>
        <td>
          <div class="acciones-td">
            <button class="btn-icon" onclick="editarEstudiante('${e.id}')" title="Editar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            </button>
            <button class="btn-icon danger" onclick="eliminarEstudiante('${e.id}')" title="Eliminar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  document.getElementById('filtroTexto').addEventListener('input', renderTabla);
  document.getElementById('filtroGrado').addEventListener('change', renderTabla);

  const modal = document.getElementById('modalEstudiante');
  const form = document.getElementById('formEstudiante');
  const msgErr = document.getElementById('msgErr');

  function abrirModal(estudiante = null) {
    form.reset();
    msgErr.classList.remove('visible');
    if (estudiante) {
      document.getElementById('modalTitulo').textContent = 'Editar estudiante';
      document.getElementById('estudianteId').value = estudiante.id;
      document.getElementById('fNombres').value = estudiante.nombres || '';
      document.getElementById('fApellidos').value = estudiante.apellidos || '';
      document.getElementById('fTipoDoc').value = estudiante.tipoDoc || 'RC';
      document.getElementById('fDocumento').value = estudiante.documento || '';
      document.getElementById('fGrado').value = estudiante.grado || '';
      document.getElementById('fAcudiente').value = estudiante.acudiente || '';
      document.getElementById('fTelefonoAcudiente').value = estudiante.telefonoAcudiente || '';
    } else {
      document.getElementById('modalTitulo').textContent = 'Agregar estudiante';
      document.getElementById('estudianteId').value = '';
    }
    modal.style.display = 'flex';
  }

  document.getElementById('btnNuevo').addEventListener('click', () => abrirModal());
  document.getElementById('btnCerrarModal').addEventListener('click', () => { modal.style.display = 'none'; });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

  window.editarEstudiante = function(id) {
    const est = estudiantesCache.find(e => e.id === id);
    if (est) abrirModal(est);
  };

  window.eliminarEstudiante = async function(id) {
    if (!confirm('¿Seguro que quieres eliminar este estudiante? Esta acción no se puede deshacer.')) return;
    try {
      await deleteDoc(doc(db, 'estudiantes', id));
      await cargarEstudiantes();
    } catch (err) {
      alert('No se pudo eliminar. Intenta de nuevo.');
      console.error(err);
    }
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    msgErr.classList.remove('visible');

    const id = document.getElementById('estudianteId').value;
    const datos = {
      institucionId,
      nombres: document.getElementById('fNombres').value.trim(),
      apellidos: document.getElementById('fApellidos').value.trim(),
      tipoDoc: document.getElementById('fTipoDoc').value,
      documento: document.getElementById('fDocumento').value.trim(),
      grado: document.getElementById('fGrado').value.trim(),
      acudiente: document.getElementById('fAcudiente').value.trim(),
      telefonoAcudiente: document.getElementById('fTelefonoAcudiente').value.trim(),
    };

    try {
      if (id) {
        await updateDoc(doc(db, 'estudiantes', id), datos);
      } else {
        datos.creadoPor = usuarioActual && auth.currentUser.uid;
        datos.fechaCreacion = serverTimestamp();
        await addDoc(collection(db, 'estudiantes'), datos);
      }
      modal.style.display = 'none';
      await cargarEstudiantes();
    } catch (err) {
      msgErr.querySelector('#msgErrTexto').textContent = 'No se pudo guardar. Intenta de nuevo.';
      msgErr.classList.add('visible');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar';
    }
  });

  document.getElementById('btnSalir').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
