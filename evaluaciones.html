<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduGestión — Evaluaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1A4F8A; --azul-dark: #123769; --azul-light: #EBF2FB;
  --morado: #553C9A; --morado-light: #F0EBFF;
  --verde: #1A7A5E; --verde-light: #E8F5F0;
  --naranja: #C05621; --naranja-light: #FFF3EB;
  --gris: #F4F6F9; --borde: #DDE3EC;
  --texto: #1A2332; --texto-mid: #4A5568; --texto-light: #8896A7;
  --blanco: #FFFFFF; --rojo: #C53030; --rojo-light: #FFF5F5;
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

.topbar { background: var(--azul); height: 58px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 0.9rem; }
.topbar-back { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.85; }
.topbar-back:hover { opacity: 1; }
.topbar-brand { font-size: 1.0rem; font-weight: 700; color: white; }
.btn-salir { background: rgba(255,255,255,0.12); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }

.main { max-width: 1000px; margin: 0 auto; padding: 2.2rem 2rem 4rem; }
.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 1rem; }
.titulo { font-family: 'Instrument Serif', serif; font-size: 1.8rem; }
.sub { font-size: 0.85rem; color: var(--texto-light); margin-bottom: 1.4rem; line-height: 1.5; }
.btn-primario { background: var(--azul); color: white; border: none; padding: 0.65rem 1.2rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
.btn-primario:hover { background: var(--azul-dark); }

.filtros-box { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; padding: 1.1rem 1.3rem; margin-bottom: 1.3rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
.filtro-field { flex: 1; min-width: 160px; }
.filtro-field label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--texto-mid); margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.03em; }
.filtro-field select, .filtro-field input { width: 100%; padding: 0.55rem 0.65rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.82rem; background: white; }

.lista-vacia { text-align: center; padding: 3rem 1rem; color: var(--texto-light); font-size: 0.85rem; background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; }

.eval-card { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; padding: 1.2rem 1.3rem; margin-bottom: 0.9rem; }
.eval-card-header { display: flex; justify-content: space-between; align-items: start; gap: 1rem; margin-bottom: 0.5rem; }
.eval-titulo { font-size: 0.95rem; font-weight: 700; }
.eval-meta { font-size: 0.76rem; color: var(--texto-light); margin-bottom: 0.6rem; display: flex; gap: 0.9rem; flex-wrap: wrap; }
.eval-meta span b { color: var(--texto-mid); }
.eval-conteo-tipos { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
.mini-chip { font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.55rem; border-radius: 8px; background: var(--gris); color: var(--texto-mid); }
.eval-enlace { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: var(--azul); text-decoration: none; font-weight: 600; margin-bottom: 0.4rem; }
.eval-enlace:hover { text-decoration: underline; }
.eval-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 0.6rem; border-top: 1px solid var(--borde); flex-wrap: wrap; gap: 0.6rem; }
.eval-autor { font-size: 0.74rem; color: var(--texto-light); }
.acciones-eval { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.btn-chip { background: none; border: 1.3px solid var(--borde); color: var(--texto-mid); padding: 0.3rem 0.7rem; border-radius: 8px; font-size: 0.74rem; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-chip:hover { background: var(--gris); }
.btn-chip.danger:hover { color: var(--rojo); border-color: var(--rojo); background: var(--rojo-light); }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,25,35,0.55); display: flex; align-items: flex-start; justify-content: center; z-index: 200; padding: 2rem 1rem; overflow-y: auto; }
.modal-box { background: var(--blanco); border-radius: 14px; width: 100%; max-width: 640px; padding: 1.6rem; margin: auto; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; }
.modal-header h2 { font-family: 'Instrument Serif', serif; font-size: 1.3rem; }
.modal-close { background: none; border: none; font-size: 1.6rem; color: var(--texto-light); cursor: pointer; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--texto-mid); margin-bottom: 0.35rem; }
.field input, .field select, .field textarea { width: 100%; padding: 0.6rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.85rem; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--azul); }
.field textarea { resize: vertical; min-height: 70px; }
.field-row { display: flex; gap: 0.8rem; }
.field-row .field { flex: 1; }

.preguntas-titulo { font-size: 0.85rem; font-weight: 700; margin: 1.2rem 0 0.7rem; padding-top: 1rem; border-top: 1.5px dashed var(--borde); }
.pregunta-card { background: var(--gris); border-radius: 10px; padding: 0.9rem; margin-bottom: 0.8rem; }
.pregunta-card-top { display: flex; gap: 0.6rem; align-items: start; margin-bottom: 0.6rem; }
.pregunta-num { font-weight: 700; font-size: 0.82rem; color: var(--texto-mid); padding-top: 0.6rem; }
.pregunta-card select.tipo-pregunta { max-width: 190px; }
.btn-quitar-pregunta { background: none; border: none; color: var(--rojo); cursor: pointer; font-size: 0.76rem; font-weight: 700; padding: 0.3rem 0.5rem; }
.opciones-wrap { margin-top: 0.6rem; }
.opcion-fila { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
.opcion-fila input[type="text"] { flex: 1; padding: 0.45rem 0.6rem; border: 1.3px solid var(--borde); border-radius: 6px; font-family: inherit; font-size: 0.8rem; }
.opcion-fila input[type="radio"] { width: 16px; height: 16px; flex-shrink: 0; }
.btn-quitar-opcion { background: none; border: none; color: var(--texto-light); cursor: pointer; font-size: 1rem; padding: 0 0.3rem; }
.btn-agregar-opcion { background: none; border: 1.3px dashed var(--borde); color: var(--texto-mid); padding: 0.3rem 0.7rem; border-radius: 6px; font-size: 0.74rem; cursor: pointer; font-family: inherit; margin-top: 0.2rem; }
.vf-opciones { display: flex; gap: 1.2rem; margin-top: 0.6rem; }
.vf-opciones label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; cursor: pointer; }
.btn-agregar-pregunta { width: 100%; background: var(--morado-light); color: var(--morado); border: 1.5px dashed var(--morado); padding: 0.7rem; border-radius: 9px; font-weight: 700; font-size: 0.84rem; cursor: pointer; font-family: inherit; margin-bottom: 1.2rem; }
.btn-agregar-pregunta:hover { background: var(--morado); color: white; }

.btn-guardar { width: 100%; background: var(--azul); color: white; border: none; border-radius: 9px; font-weight: 700; font-size: 0.88rem; padding: 0.75rem; cursor: pointer; margin-top: 0.3rem; font-family: inherit; }
.btn-guardar:disabled { opacity: 0.6; }
.msg { display: none; font-size: 0.8rem; padding: 0.6rem 0.8rem; border-radius: 8px; margin-bottom: 0.8rem; }
.msg.visible { display: block; }
.msg-err { background: var(--rojo-light); color: var(--rojo); }
.loading-wrap { text-align: center; padding: 2rem; color: var(--texto-light); font-size: 0.85rem; }

/* ── Vista de impresión ── */
.imp-doc { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 14px; padding: 2rem; display: none; }
.imp-doc.visible { display: block; }
.imp-header { display: flex; justify-content: space-between; align-items: start; padding-bottom: 1rem; border-bottom: 2px solid var(--texto); margin-bottom: 1rem; }
.imp-inst { font-family: 'Instrument Serif', serif; font-size: 1.2rem; }
.imp-titulo-doc { font-size: 0.8rem; font-weight: 700; color: var(--azul); }
.imp-datos-est { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.4rem; font-size: 0.82rem; }
.imp-datos-est span { border-bottom: 1px solid var(--texto-light); padding: 0.2rem 0.5rem 0.2rem 0; min-width: 140px; display: inline-block; }
.imp-pregunta { margin-bottom: 1.3rem; }
.imp-pregunta-enunciado { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.5rem; }
.imp-opcion { display: flex; gap: 0.5rem; align-items: center; font-size: 0.85rem; margin-bottom: 0.35rem; }
.imp-opcion .circulo { width: 14px; height: 14px; border: 1.5px solid var(--texto-mid); border-radius: 50%; flex-shrink: 0; }
.imp-linea-abierta { border-bottom: 1px solid var(--borde); height: 1.6rem; margin-bottom: 0.4rem; }
.btn-imprimir { background: var(--verde); color: white; border: none; padding: 0.65rem 1.2rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
.btn-imprimir:hover { background: #145F49; }
.btn-cerrar-imp { background: var(--gris); color: var(--texto-mid); border: none; padding: 0.65rem 1.2rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; }

@media print {
  .topbar, .filtros-box, .header-row, .btn-imprimir, .btn-cerrar-imp, #listaEvaluaciones { display: none !important; }
  body { background: white; }
  .main { padding: 0; max-width: 100%; }
  .imp-doc { border: none; padding: 0; display: block !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="dashboard.html" class="topbar-back">← Panel</a>
    <span class="topbar-brand">Evaluaciones</span>
  </div>
  <button class="btn-salir" id="btnSalir">Salir</button>
</header>

<main class="main">
  <div class="header-row">
    <div>
      <p class="titulo">Evaluaciones</p>
      <p class="sub" style="margin-bottom:0">Arma evaluaciones con preguntas de selección múltiple, verdadero/falso y abiertas — imprímelas y adjunta la evidencia de cuando las aplicaste.</p>
    </div>
    <button class="btn-primario" id="btnNuevo">+ Nueva evaluación</button>
  </div>

  <div class="filtros-box">
    <div class="filtro-field">
      <label>Grado</label>
      <select id="filtroGrado"><option value="">Todos</option></select>
    </div>
    <div class="filtro-field">
      <label>Asignatura</label>
      <select id="filtroAsignatura"><option value="">Todas</option></select>
    </div>
  </div>

  <div id="listaEvaluaciones">
    <div class="loading-wrap">Cargando...</div>
  </div>

  <div class="imp-doc" id="impDoc"></div>
</main>

<div id="modalEval" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitulo">Nueva evaluación</h2>
      <button class="modal-close" id="btnCerrarModal">&times;</button>
    </div>
    <form id="formEval">
      <input type="hidden" id="evalId"/>
      <div class="field">
        <label>Título</label>
        <input type="text" id="fTitulo" placeholder="Ej: Evaluación primer periodo — Matemáticas" required/>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Grado / Grupo</label>
          <input type="text" id="fGrado" placeholder="Ej: 5° A"/>
        </div>
        <div class="field">
          <label>Asignatura</label>
          <input type="text" id="fAsignatura" placeholder="Ej: Matemáticas"/>
        </div>
      </div>

      <p class="preguntas-titulo">Preguntas</p>
      <div id="listaPreguntas"></div>
      <button type="button" class="btn-agregar-pregunta" id="btnAgregarPregunta">+ Agregar pregunta</button>

      <div class="field">
        <label>Evidencia — enlace (foto, documento, examen resuelto...)</label>
        <input type="url" id="fEnlace" placeholder="https://drive.google.com/..."/>
      </div>
      <div class="field">
        <label>Evidencia — notas escritas (opcional)</label>
        <textarea id="fContenido" placeholder="Ej: aplicada el 15 de marzo, 22 de 25 estudiantes presentes..."></textarea>
      </div>

      <div class="msg msg-err" id="msgErr"><span id="msgErrTexto"></span></div>
      <button type="submit" class="btn-guardar" id="btnGuardar">Guardar evaluación</button>
    </form>
  </div>
</div>

<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc, updateDoc, deleteDoc, collection, addDoc, getDocs, query, where, serverTimestamp } from './firebase.js';

  let institucionId = null;
  let usuarioActual = null;
  let uidActual = null;
  let institucionNombre = '';
  let evaluacionesCache = [];
  let contadorPreguntas = 0;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    const usuarioSnap = await getDoc(doc(db, 'usuarios', user.uid));
    if (!usuarioSnap.exists()) { window.location.href = 'index.html'; return; }
    usuarioActual = usuarioSnap.data();
    uidActual = user.uid;
    institucionId = usuarioActual.institucionId;

    const instSnap = await getDoc(doc(db, 'instituciones', institucionId));
    if (instSnap.exists()) institucionNombre = instSnap.data().nombre || '';

    await cargarFiltros();
    await cargarEvaluaciones();
  });

  async function cargarFiltros() {
    const estSnap = await getDocs(query(collection(db, 'estudiantes'), where('institucionId', '==', institucionId)));
    const grados = new Set();
    estSnap.forEach(d => { const g = d.data().grado; if (g) grados.add(g); });
    const selGrado = document.getElementById('filtroGrado');
    [...grados].sort().forEach(g => {
      const opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      selGrado.appendChild(opt);
    });

    const asigSnap = await getDocs(query(collection(db, 'asignaturas'), where('institucionId', '==', institucionId)));
    const asignaturas = new Set();
    asigSnap.forEach(d => { const n = d.data().nombre; if (n) asignaturas.add(n); });
    const selAsig = document.getElementById('filtroAsignatura');
    [...asignaturas].sort().forEach(a => {
      const opt = document.createElement('option');
      opt.value = a; opt.textContent = a;
      selAsig.appendChild(opt);
    });

    ['filtroGrado', 'filtroAsignatura'].forEach(id => {
      document.getElementById(id).addEventListener('change', renderLista);
    });
  }

  async function cargarEvaluaciones() {
    const snap = await getDocs(query(collection(db, 'evaluaciones'), where('institucionId', '==', institucionId)));
    evaluacionesCache = [];
    snap.forEach(d => evaluacionesCache.push({ id: d.id, ...d.data() }));
    evaluacionesCache.sort((a, b) => {
      const ta = a.fechaCreacion && a.fechaCreacion.seconds ? a.fechaCreacion.seconds : 0;
      const tb = b.fechaCreacion && b.fechaCreacion.seconds ? b.fechaCreacion.seconds : 0;
      return tb - ta;
    });
    renderLista();
  }

  function renderLista() {
    const g = document.getElementById('filtroGrado').value;
    const a = document.getElementById('filtroAsignatura').value;

    const filtradas = evaluacionesCache.filter(ev => {
      if (g && ev.grado && ev.grado !== g) return false;
      if (a && ev.asignatura && ev.asignatura !== a) return false;
      return true;
    });

    const cont = document.getElementById('listaEvaluaciones');
    if (filtradas.length === 0) {
      cont.innerHTML = '<div class="lista-vacia">No hay evaluaciones que coincidan con estos filtros. Prueba "+ Nueva evaluación" para crear la primera.</div>';
      return;
    }

    cont.innerHTML = filtradas.map(ev => {
      const puedeEditar = usuarioActual.rol === 'admin' || ev.creadoPor === uidActual;
      const fecha = ev.fechaCreacion && ev.fechaCreacion.seconds
        ? new Date(ev.fechaCreacion.seconds * 1000).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' })
        : '';
      const preguntas = ev.preguntas || [];
      const nMult = preguntas.filter(p => p.tipo === 'multiple').length;
      const nVf = preguntas.filter(p => p.tipo === 'vf').length;
      const nAbierta = preguntas.filter(p => p.tipo === 'abierta').length;

      return `
        <div class="eval-card">
          <div class="eval-card-header">
            <p class="eval-titulo">${ev.titulo}</p>
          </div>
          <div class="eval-meta">
            <span><b>Grado:</b> ${ev.grado || 'General'}</span>
            <span><b>Asignatura:</b> ${ev.asignatura || 'General'}</span>
            <span><b>Preguntas:</b> ${preguntas.length}</span>
          </div>
          <div class="eval-conteo-tipos">
            ${nMult > 0 ? `<span class="mini-chip">${nMult} selección múltiple</span>` : ''}
            ${nVf > 0 ? `<span class="mini-chip">${nVf} verdadero/falso</span>` : ''}
            ${nAbierta > 0 ? `<span class="mini-chip">${nAbierta} abierta(s)</span>` : ''}
          </div>
          ${ev.enlace ? `<a class="eval-enlace" href="${ev.enlace}" target="_blank" rel="noopener">🔗 Ver evidencia</a><br/>` : ''}
          ${ev.contenido ? `<p style="font-size:0.82rem;color:var(--texto-mid);margin-bottom:0.5rem">${ev.contenido}</p>` : ''}
          <div class="eval-footer">
            <span class="eval-autor">${ev.creadoPorNombre || 'Sin autor'} · ${fecha}</span>
            <div class="acciones-eval">
              <button class="btn-chip" onclick="imprimirEvaluacion('${ev.id}')">🖨 Imprimir</button>
              ${puedeEditar ? `<button class="btn-chip" onclick="editarEvaluacion('${ev.id}')">Editar</button><button class="btn-chip danger" onclick="eliminarEvaluacion('${ev.id}')">Eliminar</button>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Construcción dinámica de preguntas en el modal ──
  function crearFilaPregunta(pregunta = null) {
    contadorPreguntas++;
    const idLocal = `preg-${contadorPreguntas}`;
    const div = document.createElement('div');
    div.className = 'pregunta-card';
    div.dataset.idLocal = idLocal;
    div.innerHTML = `
      <div class="pregunta-card-top">
        <select class="tipo-pregunta" onchange="cambiarTipoPregunta('${idLocal}', this.value)">
          <option value="multiple">Selección múltiple</option>
          <option value="vf">Verdadero o falso</option>
          <option value="abierta">Pregunta abierta</option>
        </select>
        <input type="text" class="enunciado-pregunta" placeholder="Escribe la pregunta..." style="flex:1"/>
        <button type="button" class="btn-quitar-pregunta" onclick="quitarPregunta('${idLocal}')">✕ Quitar</button>
      </div>
      <div class="cuerpo-pregunta"></div>
    `;
    document.getElementById('listaPreguntas').appendChild(div);
    const tipo = pregunta ? pregunta.tipo : 'multiple';
    div.querySelector('.tipo-pregunta').value = tipo;
    if (pregunta) div.querySelector('.enunciado-pregunta').value = pregunta.enunciado || '';
    renderCuerpoPregunta(idLocal, tipo, pregunta);
  }

  window.cambiarTipoPregunta = function(idLocal, tipo) {
    renderCuerpoPregunta(idLocal, tipo, null);
  };

  function renderCuerpoPregunta(idLocal, tipo, preguntaExistente) {
    const div = document.querySelector(`.pregunta-card[data-id-local="${idLocal}"] .cuerpo-pregunta`);
    if (tipo === 'multiple') {
      div.innerHTML = `<div class="opciones-wrap"></div><button type="button" class="btn-agregar-opcion" onclick="agregarOpcion('${idLocal}')">+ Agregar opción</button>`;
      const opciones = (preguntaExistente && preguntaExistente.opciones) || ['', ''];
      const correcta = preguntaExistente ? preguntaExistente.correcta : 0;
      opciones.forEach((texto, i) => agregarOpcion(idLocal, texto, i === correcta));
    } else if (tipo === 'vf') {
      const correcta = preguntaExistente && typeof preguntaExistente.correcta === 'boolean' ? preguntaExistente.correcta : true;
      div.innerHTML = `
        <div class="vf-opciones">
          <label><input type="radio" name="vf-${idLocal}" value="true" ${correcta ? 'checked' : ''}/> Verdadero</label>
          <label><input type="radio" name="vf-${idLocal}" value="false" ${!correcta ? 'checked' : ''}/> Falso</label>
        </div>`;
    } else {
      div.innerHTML = `<p style="font-size:0.76rem;color:var(--texto-light)">El estudiante responderá con texto libre — no tiene respuesta correcta predefinida.</p>`;
    }
  }

  window.agregarOpcion = function(idLocal, texto = '', marcada = false) {
    const wrap = document.querySelector(`.pregunta-card[data-id-local="${idLocal}"] .opciones-wrap`);
    const fila = document.createElement('div');
    fila.className = 'opcion-fila';
    fila.innerHTML = `
      <input type="radio" name="correcta-${idLocal}" ${marcada ? 'checked' : ''}/>
      <input type="text" placeholder="Texto de la opción" value="${texto}"/>
      <button type="button" class="btn-quitar-opcion" onclick="this.parentElement.remove()">✕</button>
    `;
    wrap.appendChild(fila);
  };

  window.quitarPregunta = function(idLocal) {
    document.querySelector(`.pregunta-card[data-id-local="${idLocal}"]`).remove();
  };

  document.getElementById('btnAgregarPregunta').addEventListener('click', () => crearFilaPregunta());

  function recolectarPreguntas() {
    const preguntas = [];
    document.querySelectorAll('#listaPreguntas .pregunta-card').forEach((card, idx) => {
      const tipo = card.querySelector('.tipo-pregunta').value;
      const enunciado = card.querySelector('.enunciado-pregunta').value.trim();
      if (!enunciado) return;
      const pregunta = { id: `p${idx + 1}`, tipo, enunciado };
      if (tipo === 'multiple') {
        const opciones = [];
        let correcta = 0;
        card.querySelectorAll('.opcion-fila').forEach((fila, i) => {
          const texto = fila.querySelector('input[type="text"]').value.trim();
          const marcada = fila.querySelector('input[type="radio"]').checked;
          if (texto) {
            opciones.push(texto);
            if (marcada) correcta = opciones.length - 1;
          }
        });
        pregunta.opciones = opciones;
        pregunta.correcta = correcta;
      } else if (tipo === 'vf') {
        const seleccion = card.querySelector('input[type="radio"]:checked');
        pregunta.correcta = seleccion ? seleccion.value === 'true' : true;
      }
      preguntas.push(pregunta);
    });
    return preguntas;
  }

  // ── Modal abrir/cerrar ──
  const modal = document.getElementById('modalEval');
  const form = document.getElementById('formEval');
  const msgErr = document.getElementById('msgErr');

  function abrirModal(evaluacion = null) {
    form.reset();
    msgErr.classList.remove('visible');
    document.getElementById('listaPreguntas').innerHTML = '';
    contadorPreguntas = 0;

    if (evaluacion) {
      document.getElementById('modalTitulo').textContent = 'Editar evaluación';
      document.getElementById('evalId').value = evaluacion.id;
      document.getElementById('fTitulo').value = evaluacion.titulo || '';
      document.getElementById('fGrado').value = evaluacion.grado || '';
      document.getElementById('fAsignatura').value = evaluacion.asignatura || '';
      document.getElementById('fEnlace').value = evaluacion.enlace || '';
      document.getElementById('fContenido').value = evaluacion.contenido || '';
      (evaluacion.preguntas || []).forEach(p => crearFilaPregunta(p));
    } else {
      document.getElementById('modalTitulo').textContent = 'Nueva evaluación';
      document.getElementById('evalId').value = '';
      crearFilaPregunta();
    }
    modal.style.display = 'flex';
  }

  document.getElementById('btnNuevo').addEventListener('click', () => abrirModal());
  document.getElementById('btnCerrarModal').addEventListener('click', () => { modal.style.display = 'none'; });
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

  window.editarEvaluacion = function(id) {
    const ev = evaluacionesCache.find(x => x.id === id);
    if (ev) abrirModal(ev);
  };

  window.eliminarEvaluacion = async function(id) {
    if (!confirm('¿Seguro que quieres eliminar esta evaluación?')) return;
    try {
      await deleteDoc(doc(db, 'evaluaciones', id));
      await cargarEvaluaciones();
    } catch (err) {
      alert('No se pudo eliminar. Intenta de nuevo.');
      console.error(err);
    }
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    msgErr.classList.remove('visible');

    const titulo = document.getElementById('fTitulo').value.trim();
    const preguntas = recolectarPreguntas();

    if (preguntas.length === 0) {
      msgErr.querySelector('#msgErrTexto').textContent = 'Agrega al menos una pregunta con su enunciado.';
      msgErr.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Guardar evaluación';
      return;
    }

    const id = document.getElementById('evalId').value;
    const datos = {
      institucionId,
      titulo,
      grado: document.getElementById('fGrado').value.trim(),
      asignatura: document.getElementById('fAsignatura').value.trim(),
      preguntas,
      enlace: document.getElementById('fEnlace').value.trim(),
      contenido: document.getElementById('fContenido').value.trim(),
    };

    try {
      if (id) {
        await updateDoc(doc(db, 'evaluaciones', id), datos);
      } else {
        datos.creadoPor = uidActual;
        datos.creadoPorNombre = usuarioActual.nombre || '';
        datos.fechaCreacion = serverTimestamp();
        await addDoc(collection(db, 'evaluaciones'), datos);
      }
      modal.style.display = 'none';
      await cargarEvaluaciones();
    } catch (err) {
      msgErr.querySelector('#msgErrTexto').textContent = 'No se pudo guardar. Intenta de nuevo.';
      msgErr.classList.add('visible');
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar evaluación';
    }
  });

  // ── Vista imprimible ──
  window.imprimirEvaluacion = function(id) {
    const ev = evaluacionesCache.find(x => x.id === id);
    if (!ev) return;

    const preguntasHtml = (ev.preguntas || []).map((p, i) => {
      let cuerpo = '';
      if (p.tipo === 'multiple') {
        cuerpo = (p.opciones || []).map(op => `<div class="imp-opcion"><span class="circulo"></span>${op}</div>`).join('');
      } else if (p.tipo === 'vf') {
        cuerpo = `<div class="imp-opcion"><span class="circulo"></span>Verdadero</div><div class="imp-opcion"><span class="circulo"></span>Falso</div>`;
      } else {
        cuerpo = `<div class="imp-linea-abierta"></div><div class="imp-linea-abierta"></div>`;
      }
      return `<div class="imp-pregunta"><p class="imp-pregunta-enunciado">${i + 1}. ${p.enunciado}</p>${cuerpo}</div>`;
    }).join('');

    document.getElementById('impDoc').innerHTML = `
      <div class="imp-header">
        <div><p class="imp-inst">${institucionNombre || '—'}</p></div>
        <p class="imp-titulo-doc">${ev.titulo}</p>
      </div>
      <div class="imp-datos-est">
        <span>Nombre: ______________________</span>
        <span>Grado: ${ev.grado || '______'}</span>
        <span>Fecha: ____/____/______</span>
      </div>
      ${preguntasHtml}
      <div style="margin-top:1.5rem;display:flex;gap:0.7rem">
        <button class="btn-imprimir" onclick="window.print()">Imprimir / Guardar PDF</button>
        <button class="btn-cerrar-imp" onclick="document.getElementById('impDoc').classList.remove('visible'); document.getElementById('impDoc').innerHTML='';">Cerrar</button>
      </div>
    `;
    document.getElementById('impDoc').classList.add('visible');
    document.getElementById('impDoc').scrollIntoView({ behavior: 'smooth' });
  };

  document.getElementById('btnSalir').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
