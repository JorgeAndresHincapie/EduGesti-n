<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduGestión — Horario</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1A4F8A; --azul-dark: #123769; --azul-light: #EBF2FB;
  --verde: #1A7A5E; --verde-light: #E8F5F0;
  --gris: #F4F6F9; --borde: #DDE3EC;
  --texto: #1A2332; --texto-mid: #4A5568; --texto-light: #8896A7;
  --blanco: #FFFFFF; --rojo: #C53030; --rojo-light: #FFF5F5;
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

.topbar { background: var(--azul); height: 58px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 0.9rem; }
.topbar-back { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.85; }
.topbar-back:hover { opacity: 1; }
.topbar-brand { font-size: 1.0rem; font-weight: 700; color: white; }
.btn-salir { background: rgba(255,255,255,0.12); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }

.main { max-width: 1050px; margin: 0 auto; padding: 2.2rem 2rem 4rem; }
.titulo { font-family: 'Instrument Serif', serif; font-size: 1.8rem; margin-bottom: 1.5rem; }

.filtros-box { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; padding: 1.3rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
.filtro-field { flex: 1; min-width: 200px; }
.filtro-field label { display: block; font-size: 0.74rem; font-weight: 700; color: var(--texto-mid); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.03em; }
.filtro-field select { width: 100%; padding: 0.6rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.85rem; background: white; }
.btn-imprimir { background: var(--verde); color: white; border: none; padding: 0.65rem 1.2rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
.btn-imprimir:hover { background: #145F49; }
.btn-imprimir:disabled { opacity: 0.5; cursor: default; }

.aviso { text-align: center; padding: 3rem 1.5rem; color: var(--texto-light); font-size: 0.88rem; background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; }

.horario-wrap { display: none; background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 14px; padding: 1.3rem; overflow-x: auto; }
.horario-wrap.visible { display: block; }
table.horario { width: 100%; border-collapse: collapse; min-width: 700px; }
table.horario th { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--texto-light); padding: 0.6rem; background: var(--gris); border: 1px solid var(--borde); text-align: center; }
table.horario th.col-hora { width: 90px; }
table.horario td { border: 1px solid var(--borde); padding: 0; height: 62px; vertical-align: top; }
.celda-hora { font-size: 0.72rem; color: var(--texto-light); text-align: center; padding: 0.5rem 0.3rem; font-weight: 700; background: var(--gris); }
.celda-clase { width: 100%; height: 100%; padding: 0.4rem 0.5rem; cursor: pointer; display: flex; flex-direction: column; justify-content: center; transition: filter 0.1s; }
.celda-clase:hover { filter: brightness(0.95); }
.celda-clase.vacia { background: var(--blanco); }
.celda-clase.vacia:hover { background: var(--azul-light); }
.celda-clase .cc-nombre { font-size: 0.76rem; font-weight: 700; line-height: 1.2; }
.celda-clase .cc-docente { font-size: 0.66rem; opacity: 0.85; margin-top: 0.15rem; }
.celda-clase.vacia::after { content: '+'; color: var(--texto-light); font-size: 1.1rem; text-align: center; width: 100%; }

.leyenda { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.2rem; }
.leyenda-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.76rem; color: var(--texto-mid); }
.leyenda-color { width: 12px; height: 12px; border-radius: 3px; }

.modal-overlay { position: fixed; inset: 0; background: rgba(20,25,35,0.55); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
.modal-box { background: var(--blanco); border-radius: 14px; width: 100%; max-width: 380px; padding: 1.6rem; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.modal-header h2 { font-family: 'Instrument Serif', serif; font-size: 1.15rem; }
.modal-close { background: none; border: none; font-size: 1.6rem; color: var(--texto-light); cursor: pointer; }
.modal-sub { font-size: 0.78rem; color: var(--texto-light); margin-bottom: 1rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--texto-mid); margin-bottom: 0.35rem; }
.field select { width: 100%; padding: 0.6rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.85rem; }
.btn-guardar { width: 100%; background: var(--azul); color: white; border: none; border-radius: 9px; font-weight: 700; font-size: 0.88rem; padding: 0.7rem; cursor: pointer; font-family: inherit; margin-top: 0.3rem; }
.btn-quitar { width: 100%; background: var(--rojo-light); color: var(--rojo); border: none; border-radius: 9px; font-weight: 700; font-size: 0.82rem; padding: 0.6rem; cursor: pointer; font-family: inherit; margin-top: 0.6rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="dashboard.html" class="topbar-back">← Panel</a>
    <span class="topbar-brand">Horario</span>
  </div>
  <button class="btn-salir" id="btnSalir">Salir</button>
</header>

<main class="main">
  <p class="titulo">Horario de Clases</p>

  <div class="filtros-box">
    <div class="filtro-field">
      <label>Grado / Grupo</label>
      <select id="selGrado"><option value="">Selecciona...</option></select>
    </div>
    <button class="btn-imprimir" id="btnImprimir" disabled>Imprimir horario</button>
  </div>

  <div class="aviso" id="avisoVacio">Selecciona un grado/grupo para ver o armar su horario. Haz clic en cualquier casilla vacía para asignarle una clase.</div>

  <div class="horario-wrap" id="horarioWrap">
    <table class="horario" id="tablaHorario"></table>
    <div class="leyenda" id="leyenda"></div>
  </div>
</main>

<div id="modalCelda" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Asignar clase</h2>
      <button class="modal-close" id="btnCerrarModal">&times;</button>
    </div>
    <p class="modal-sub" id="modalSub">—</p>
    <form id="formCelda">
      <div class="field">
        <label>Asignatura</label>
        <select id="selAsignaturaCelda" required>
          <option value="">Selecciona...</option>
        </select>
      </div>
      <button type="submit" class="btn-guardar">Guardar</button>
    </form>
    <button class="btn-quitar" id="btnQuitarClase" style="display:none">Quitar esta clase del horario</button>
  </div>
</div>

<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where } from './firebase.js';

  const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
  const HORAS = ['6:00','7:00','8:00','9:00','10:00','11:00','12:00','13:00'];
  const COLORES = ['#1A4F8A','#1A7A5E','#C05621','#553C9A','#B7791F','#276749','#9B2C6F','#2B6CB0','#C53030','#0F6E56'];

  let institucionId = null;
  let asignaturasCache = [];
  let horarioCache = {}; // key: dia_hora -> {asignaturaId, nombre, docente}
  let coloresPorAsignatura = {};
  let celdaActual = null; // {dia, hora}

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    const usuarioSnap = await getDoc(doc(db, 'usuarios', user.uid));
    if (!usuarioSnap.exists()) { window.location.href = 'index.html'; return; }
    institucionId = usuarioSnap.data().institucionId;

    const asigSnap = await getDocs(query(collection(db, 'asignaturas'), where('institucionId', '==', institucionId)));
    asigSnap.forEach(d => asignaturasCache.push({ id: d.id, ...d.data() }));

    const estSnap = await getDocs(query(collection(db, 'estudiantes'), where('institucionId', '==', institucionId)));
    const grados = new Set();
    estSnap.forEach(d => { if (d.data().grado) grados.add(d.data().grado); });
    const sel = document.getElementById('selGrado');
    sel.innerHTML = '<option value="">Selecciona...</option>' + [...grados].sort().map(g => `<option value="${g}">${g}</option>`).join('');
  });

  document.getElementById('selGrado').addEventListener('change', cargarHorario);

  function asignarColor(asignaturaId) {
    if (!coloresPorAsignatura[asignaturaId]) {
      const idx = Object.keys(coloresPorAsignatura).length % COLORES.length;
      coloresPorAsignatura[asignaturaId] = COLORES[idx];
    }
    return coloresPorAsignatura[asignaturaId];
  }

  async function cargarHorario() {
    const grado = document.getElementById('selGrado').value;
    const wrap = document.getElementById('horarioWrap');
    const aviso = document.getElementById('avisoVacio');
    const btnImprimir = document.getElementById('btnImprimir');

    if (!grado) {
      wrap.classList.remove('visible');
      aviso.style.display = 'block';
      btnImprimir.disabled = true;
      return;
    }

    aviso.style.display = 'none';
    wrap.classList.add('visible');
    btnImprimir.disabled = false;

    const q = query(collection(db, 'horario'), where('institucionId', '==', institucionId), where('grado', '==', grado));
    const snap = await getDocs(q);
    horarioCache = {};
    coloresPorAsignatura = {};
    snap.forEach(d => {
      const n = d.data();
      horarioCache[`${n.dia}_${n.hora}`] = { asignaturaId: n.asignaturaId, nombre: n.asignaturaNombre, docente: n.docente };
    });
    Object.values(horarioCache).forEach(c => asignarColor(c.asignaturaId));

    renderTablaHorario(grado);
  }

  function renderTablaHorario(grado) {
    const tabla = document.getElementById('tablaHorario');
    let html = '<thead><tr><th class="col-hora">Hora</th>' + DIAS.map(d => `<th>${d}</th>`).join('') + '</tr></thead><tbody>';

    HORAS.forEach(hora => {
      html += `<tr><td class="celda-hora">${hora}</td>`;
      DIAS.forEach(dia => {
        const key = `${dia}_${hora}`;
        const clase = horarioCache[key];
        if (clase) {
          const color = asignarColor(clase.asignaturaId);
          html += `<td><div class="celda-clase" style="background:${color}22;border-left:4px solid ${color}" onclick="abrirModalCelda('${dia}','${hora}')">
            <div class="cc-nombre" style="color:${color}">${clase.nombre}</div>
            ${clase.docente ? `<div class="cc-docente">${clase.docente}</div>` : ''}
          </div></td>`;
        } else {
          html += `<td><div class="celda-clase vacia" onclick="abrirModalCelda('${dia}','${hora}')"></div></td>`;
        }
      });
      html += '</tr>';
    });

    html += '</tbody>';
    tabla.innerHTML = html;

    // Leyenda
    const leyenda = document.getElementById('leyenda');
    const asignaturasEnUso = [...new Set(Object.values(horarioCache).map(c => c.asignaturaId))];
    leyenda.innerHTML = asignaturasEnUso.map(id => {
      const clase = Object.values(horarioCache).find(c => c.asignaturaId === id);
      return `<div class="leyenda-item"><span class="leyenda-color" style="background:${coloresPorAsignatura[id]}"></span>${clase.nombre}</div>`;
    }).join('');
  }

  window.abrirModalCelda = function(dia, hora) {
    celdaActual = { dia, hora };
    const grado = document.getElementById('selGrado').value;
    document.getElementById('modalSub').textContent = `${dia} — ${hora}`;

    const asignaturasDelGrado = asignaturasCache.filter(a => !a.grado || a.grado === grado);
    const selAsig = document.getElementById('selAsignaturaCelda');
    selAsig.innerHTML = '<option value="">Selecciona...</option>' +
      asignaturasDelGrado.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('');

    const key = `${dia}_${hora}`;
    const claseActual = horarioCache[key];
    const btnQuitar = document.getElementById('btnQuitarClase');
    if (claseActual) {
      selAsig.value = claseActual.asignaturaId;
      btnQuitar.style.display = 'block';
    } else {
      btnQuitar.style.display = 'none';
    }

    document.getElementById('modalCelda').style.display = 'flex';
  };

  document.getElementById('btnCerrarModal').addEventListener('click', () => {
    document.getElementById('modalCelda').style.display = 'none';
  });
  document.getElementById('modalCelda').addEventListener('click', (e) => {
    if (e.target.id === 'modalCelda') document.getElementById('modalCelda').style.display = 'none';
  });

  document.getElementById('formCelda').addEventListener('submit', async (e) => {
    e.preventDefault();
    const grado = document.getElementById('selGrado').value;
    const asignaturaId = document.getElementById('selAsignaturaCelda').value;
    if (!asignaturaId) return;

    const asignatura = asignaturasCache.find(a => a.id === asignaturaId);
    const horarioId = `${grado}_${celdaActual.dia}_${celdaActual.hora}`.replace(/\s+/g, '-');

    try {
      await setDoc(doc(db, 'horario', horarioId), {
        institucionId,
        grado,
        dia: celdaActual.dia,
        hora: celdaActual.hora,
        asignaturaId,
        asignaturaNombre: asignatura.nombre,
        docente: asignatura.docente || '',
      });
      document.getElementById('modalCelda').style.display = 'none';
      await cargarHorario();
    } catch (err) {
      alert('No se pudo guardar. Intenta de nuevo.');
      console.error(err);
    }
  });

  document.getElementById('btnQuitarClase').addEventListener('click', async () => {
    const grado = document.getElementById('selGrado').value;
    const horarioId = `${grado}_${celdaActual.dia}_${celdaActual.hora}`.replace(/\s+/g, '-');
    try {
      await deleteDoc(doc(db, 'horario', horarioId));
      document.getElementById('modalCelda').style.display = 'none';
      await cargarHorario();
    } catch (err) {
      alert('No se pudo quitar. Intenta de nuevo.');
      console.error(err);
    }
  });

  document.getElementById('btnImprimir').addEventListener('click', () => window.print());

  document.getElementById('btnSalir').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>

<style>
@media print {
  .topbar, .filtros-box, .btn-imprimir, .celda-clase.vacia::after { display: none !important; }
  body { background: white; }
  .main { padding: 0; max-width: 100%; }
  .horario-wrap { border: none; }
}
</style>
</body>
</html>
