<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduGestión — Horario</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1A4F8A; --azul-dark: #123769; --azul-light: #EBF2FB;
  --verde: #1A7A5E; --verde-light: #E8F5F0;
  --naranja: #C05621; --naranja-light: #FFF3EB;
  --morado: #553C9A; --morado-light: #F0EBFF;
  --rojo: #C53030; --rojo-light: #FFF5F5;
  --gris: #F4F6F9; --borde: #DDE3EC;
  --texto: #1A2332; --texto-mid: #4A5568; --texto-light: #8896A7;
  --blanco: #FFFFFF;
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

.topbar { background: var(--azul); height: 58px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 0.9rem; }
.topbar-back { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.85; }
.topbar-back:hover { opacity: 1; }
.topbar-brand { font-size: 1.0rem; font-weight: 700; color: white; }
.btn-salir { background: rgba(255,255,255,0.12); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }

.main { max-width: 1150px; margin: 0 auto; padding: 2.2rem 2rem 4rem; }
.titulo { font-family: 'Instrument Serif', serif; font-size: 1.8rem; margin-bottom: 0.4rem; }
.sub { font-size: 0.85rem; color: var(--texto-light); margin-bottom: 1.6rem; line-height: 1.5; }

.filtros-box { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; padding: 1.3rem; margin-bottom: 1.3rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
.filtro-field { min-width: 180px; }
.filtro-field label { display: block; font-size: 0.74rem; font-weight: 700; color: var(--texto-mid); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.03em; }
.filtro-field select, .filtro-field input { width: 100%; padding: 0.6rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.85rem; background: white; }
.filtro-field input[type="number"] { width: 90px; }

.btn-secundario { background: var(--morado-light); color: var(--morado); border: 1.5px solid var(--morado); padding: 0.6rem 1.1rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
.btn-secundario:hover { background: var(--morado); color: white; }
.btn-secundario:disabled { opacity: 0.5; cursor: default; }
.btn-primario { background: var(--azul); color: white; border: none; padding: 0.65rem 1.3rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
.btn-primario:hover { background: var(--azul-dark); }
.btn-primario:disabled { opacity: 0.5; cursor: default; }

.aviso { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; padding: 2.5rem; text-align: center; color: var(--texto-light); font-size: 0.85rem; }

.contenido-grid { display: grid; grid-template-columns: 1fr 280px; gap: 1.3rem; align-items: start; }
@media (max-width: 900px) { .contenido-grid { grid-template-columns: 1fr; } }

.card { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; padding: 1.4rem; }

.tabla-horario { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.tabla-horario th { background: var(--azul); color: white; padding: 0.6rem 0.5rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
.tabla-horario th:first-child { border-radius: 8px 0 0 0; }
.tabla-horario th:last-child { border-radius: 0 8px 0 0; }
.tabla-horario td { border: 1px solid var(--borde); padding: 0.35rem; vertical-align: middle; }
.celda-periodo { background: var(--gris); font-weight: 700; text-align: center; font-size: 0.72rem; color: var(--texto-mid); white-space: nowrap; }
.celda-horario select { width: 100%; padding: 0.4rem 0.35rem; border: 1.3px solid var(--borde); border-radius: 6px; font-family: inherit; font-size: 0.74rem; background: white; cursor: pointer; }
.celda-horario select.vacio { color: var(--texto-light); background: var(--gris); }
.celda-horario select.lleno { background: var(--azul-light); border-color: var(--azul); font-weight: 600; }

.resumen-titulo { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.8rem; }
.resumen-item { padding: 0.6rem 0.7rem; border-radius: 8px; margin-bottom: 0.5rem; font-size: 0.76rem; }
.resumen-item-nombre { font-weight: 700; margin-bottom: 0.15rem; }
.resumen-completo { background: var(--verde-light); color: var(--verde); }
.resumen-incompleto { background: var(--naranja-light); color: var(--naranja); }
.resumen-excedido { background: var(--rojo-light); color: var(--rojo); }
.resumen-vacio { text-align: center; color: var(--texto-light); font-size: 0.8rem; padding: 1rem; }

.footer-acciones { display: flex; justify-content: flex-end; gap: 0.7rem; margin-top: 1.2rem; }
.mensaje-guardado { font-size: 0.8rem; padding: 0.6rem 0.9rem; border-radius: 8px; margin-top: 0.9rem; display: none; }
.mensaje-guardado.visible { display: block; }
.mensaje-guardado.ok { background: var(--verde-light); color: var(--verde); }
.mensaje-guardado.warn { background: var(--naranja-light); color: var(--naranja); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="dashboard.html" class="topbar-back">← Panel</a>
    <span class="topbar-brand">Horario</span>
  </div>
  <button class="btn-salir" id="btnSalir">Salir</button>
</header>

<main class="main">
  <p class="titulo">Horario semanal</p>
  <p class="sub">Genera un borrador automático con las asignaturas y horas ya cargadas, y ajusta cualquier casilla a mano.</p>

  <div class="filtros-box">
    <div class="filtro-field">
      <label>Grado / Grupo</label>
      <select id="selGrado"><option value="">Selecciona...</option></select>
    </div>
    <div class="filtro-field">
      <label>Periodos por día</label>
      <input type="number" id="inputPeriodos" min="4" max="10" value="6"/>
    </div>
    <button class="btn-secundario" id="btnGenerarBorrador" disabled>🔄 Generar borrador automático</button>
    <button class="btn-primario" id="btnGuardarHorario" disabled>Guardar horario</button>
  </div>

  <div class="aviso" id="avisoVacio">Selecciona un grado para ver o armar su horario.</div>

  <div class="contenido-grid" id="contenidoGrid" style="display:none">
    <div class="card">
      <div style="overflow-x:auto">
        <table class="tabla-horario" id="tablaHorario"></table>
      </div>
      <div class="mensaje-guardado" id="mensajeGuardado"></div>
    </div>

    <div class="card">
      <p class="resumen-titulo">Horas por asignatura</p>
      <div id="resumenAsignaturas"></div>
    </div>
  </div>
</main>

<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc, setDoc, getDocs, collection, query, where, serverTimestamp } from './firebase.js';

  const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
  const COLOR_PALETA = ['#1A4F8A', '#1A7A5E', '#C05621', '#553C9A', '#B83280', '#2C7A7B', '#975A16', '#2B6CB0'];

  let institucionId = null;
  let asignaturasDelGrado = []; // [{id, nombre, docente, intensidad}] para el grado seleccionado
  let grid = []; // grid[periodoIdx][diaIdx] = { asignaturaId, nombre, docente } | null
  let numPeriodos = 6;
  let gradoActual = '';

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    const usuarioSnap = await getDoc(doc(db, 'usuarios', user.uid));
    if (!usuarioSnap.exists()) { window.location.href = 'index.html'; return; }
    const usuarioActual = usuarioSnap.data();
    if (usuarioActual.rol !== 'admin') { window.location.href = 'dashboard.html'; return; }
    institucionId = usuarioActual.institucionId;

    const estSnap = await getDocs(query(collection(db, 'estudiantes'), where('institucionId', '==', institucionId)));
    const grados = new Set();
    estSnap.forEach(d => { const g = d.data().grado; if (g) grados.add(g); });

    const selGrado = document.getElementById('selGrado');
    [...grados].sort().forEach(g => {
      const opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      selGrado.appendChild(opt);
    });
  });

  document.getElementById('selGrado').addEventListener('change', () => cargarGrado());
  document.getElementById('inputPeriodos').addEventListener('change', () => {
    const n = parseInt(document.getElementById('inputPeriodos').value, 10);
    if (n >= 4 && n <= 10) {
      numPeriodos = n;
      redimensionarGrid();
      renderTabla();
    }
  });

  async function cargarGrado() {
    gradoActual = document.getElementById('selGrado').value;
    document.getElementById('mensajeGuardado').classList.remove('visible');
    if (!gradoActual) {
      document.getElementById('avisoVacio').style.display = 'block';
      document.getElementById('contenidoGrid').style.display = 'none';
      document.getElementById('btnGenerarBorrador').disabled = true;
      document.getElementById('btnGuardarHorario').disabled = true;
      return;
    }

    const asigSnap = await getDocs(query(collection(db, 'asignaturas'), where('institucionId', '==', institucionId)));
    asignaturasDelGrado = [];
    asigSnap.forEach(d => {
      const a = d.data();
      if (!a.grado || a.grado === gradoActual) {
        asignaturasDelGrado.push({ id: d.id, nombre: a.nombre, docente: a.docente || '', intensidad: typeof a.intensidad === 'number' ? a.intensidad : null });
      }
    });
    asignaturasDelGrado.sort((a, b) => a.nombre.localeCompare(b.nombre));

    if (asignaturasDelGrado.length === 0) {
      document.getElementById('avisoVacio').textContent = 'Este grado todavía no tiene asignaturas cargadas — ve primero a Carga académica o Asignaturas.';
      document.getElementById('avisoVacio').style.display = 'block';
      document.getElementById('contenidoGrid').style.display = 'none';
      document.getElementById('btnGenerarBorrador').disabled = true;
      document.getElementById('btnGuardarHorario').disabled = true;
      return;
    }

    document.getElementById('avisoVacio').style.display = 'none';
    document.getElementById('contenidoGrid').style.display = 'grid';
    document.getElementById('btnGenerarBorrador').disabled = false;
    document.getElementById('btnGuardarHorario').disabled = false;

    // ── Intenta cargar un horario ya guardado para este grado ──
    const horarioId = `${institucionId}__${gradoActual}`;
    const horarioSnap = await getDoc(doc(db, 'horarios', horarioId));
    if (horarioSnap.exists()) {
      const data = horarioSnap.data();
      numPeriodos = data.periodosPorDia || 6;
      document.getElementById('inputPeriodos').value = numPeriodos;
      grid = data.grid || crearGridVacio();
      // asegurar tamaño correcto por si cambió el número de asignaturas o periodos
      redimensionarGrid();
    } else {
      numPeriodos = parseInt(document.getElementById('inputPeriodos').value, 10) || 6;
      grid = crearGridVacio();
    }

    renderTabla();
    renderResumen();
  }

  function crearGridVacio() {
    return Array.from({ length: numPeriodos }, () => Array.from({ length: DIAS.length }, () => null));
  }

  function redimensionarGrid() {
    const nuevo = Array.from({ length: numPeriodos }, (_, p) =>
      Array.from({ length: DIAS.length }, (_, d) => (grid[p] && grid[p][d]) ? grid[p][d] : null)
    );
    grid = nuevo;
  }

  function colorAsignatura(nombre) {
    let hash = 0;
    for (let i = 0; i < nombre.length; i++) hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
    return COLOR_PALETA[Math.abs(hash) % COLOR_PALETA.length];
  }

  document.getElementById('btnGenerarBorrador').addEventListener('click', () => {
    if (grid.some(fila => fila.some(c => c !== null))) {
      if (!confirm('Ya hay celdas ocupadas en este horario. ¿Generar un borrador nuevo reemplaza todo lo que hayas puesto manualmente?')) return;
    }
    generarBorrador();
    renderTabla();
    renderResumen();
  });

  function generarBorrador() {
    grid = crearGridVacio();
    const capacidadTotal = numPeriodos * DIAS.length;

    // Asignaturas con intensidad definida, de mayor a menor (las más grandes se acomodan primero, es más fácil evitar choques)
    const pendientes = asignaturasDelGrado
      .filter(a => a.intensidad && a.intensidad > 0)
      .map(a => ({ ...a, restantes: a.intensidad }))
      .sort((a, b) => b.intensidad - a.intensidad);

    const totalNecesario = pendientes.reduce((s, a) => s + a.intensidad, 0);
    let avisoCapacidad = totalNecesario > capacidadTotal;

    // Recorre en orden round-robin por día para repartir parejo, evitando repetir la misma materia el mismo día si es posible
    for (const asig of pendientes) {
      let intentos = 0;
      while (asig.restantes > 0 && intentos < capacidadTotal * 2) {
        intentos++;
        // busca la celda vacía con menos ocupación en su día, priorizando no repetir asignatura en el mismo día
        let mejorCelda = null;
        for (let p = 0; p < numPeriodos; p++) {
          for (let d = 0; d < DIAS.length; d++) {
            if (grid[p][d] !== null) continue;
            const yaEnEseDia = grid.some(fila => fila[d] && fila[d].asignaturaId === asig.id);
            if (!yaEnEseDia) { mejorCelda = { p, d }; break; }
          }
          if (mejorCelda) break;
        }
        // si no hay celda libre sin repetir, toma cualquier celda libre
        if (!mejorCelda) {
          for (let p = 0; p < numPeriodos && !mejorCelda; p++) {
            for (let d = 0; d < DIAS.length; d++) {
              if (grid[p][d] === null) { mejorCelda = { p, d }; break; }
            }
          }
        }
        if (!mejorCelda) break; // no hay más espacio
        grid[mejorCelda.p][mejorCelda.d] = { asignaturaId: asig.id, nombre: asig.nombre, docente: asig.docente };
        asig.restantes--;
      }
    }

    const msg = document.getElementById('mensajeGuardado');
    if (avisoCapacidad) {
      msg.className = 'mensaje-guardado warn visible';
      msg.textContent = `⚠ La suma de horas de las asignaturas (${totalNecesario}h) supera la capacidad de la grilla (${capacidadTotal}h). Aumenta "Periodos por día" o revisa las intensidades. Se ubicó lo que cupo.`;
    } else {
      msg.className = 'mensaje-guardado ok visible';
      msg.textContent = `✓ Borrador generado. Revisa y ajusta cualquier celda antes de guardar.`;
    }
  }

  function renderTabla() {
    const tabla = document.getElementById('tablaHorario');
    let thead = `<tr><th>Periodo</th>${DIAS.map(d => `<th>${d}</th>`).join('')}</tr>`;
    let tbody = '';
    for (let p = 0; p < numPeriodos; p++) {
      tbody += `<tr><td class="celda-periodo">Periodo ${p + 1}</td>`;
      for (let d = 0; d < DIAS.length; d++) {
        const actual = grid[p][d];
        const opciones = asignaturasDelGrado.map(a =>
          `<option value="${a.id}" ${actual && actual.asignaturaId === a.id ? 'selected' : ''}>${a.nombre}${a.docente ? ' — ' + a.docente : ''}</option>`
        ).join('');
        tbody += `
          <td class="celda-horario">
            <select onchange="cambiarCelda(${p}, ${d}, this.value)" class="${actual ? 'lleno' : 'vacio'}" style="${actual ? `border-color:${colorAsignatura(actual.nombre)}` : ''}">
              <option value="">— Libre —</option>
              ${opciones}
            </select>
          </td>`;
      }
      tbody += '</tr>';
    }
    tabla.innerHTML = thead + tbody;
  }

  window.cambiarCelda = function(p, d, asignaturaId) {
    if (!asignaturaId) {
      grid[p][d] = null;
    } else {
      const a = asignaturasDelGrado.find(x => x.id === asignaturaId);
      grid[p][d] = a ? { asignaturaId: a.id, nombre: a.nombre, docente: a.docente } : null;
    }
    renderTabla();
    renderResumen();
  };

  function renderResumen() {
    const cont = document.getElementById('resumenAsignaturas');
    if (asignaturasDelGrado.length === 0) {
      cont.innerHTML = '<p class="resumen-vacio">Sin asignaturas.</p>';
      return;
    }
    cont.innerHTML = asignaturasDelGrado.map(a => {
      let colocadas = 0;
      grid.forEach(fila => fila.forEach(c => { if (c && c.asignaturaId === a.id) colocadas++; }));
      const meta = a.intensidad;
      let clase = 'resumen-incompleto';
      let textoEstado = meta != null ? `${colocadas} / ${meta}h ubicadas` : `${colocadas}h ubicadas (sin meta definida)`;
      if (meta != null) {
        if (colocadas === meta) clase = 'resumen-completo';
        else if (colocadas > meta) clase = 'resumen-excedido';
        else clase = 'resumen-incompleto';
      } else {
        clase = 'resumen-incompleto';
      }
      return `
        <div class="resumen-item ${clase}">
          <div class="resumen-item-nombre">${a.nombre}</div>
          <div>${textoEstado}${a.docente ? ' · ' + a.docente : ''}</div>
        </div>`;
    }).join('');
  }

  document.getElementById('btnGuardarHorario').addEventListener('click', async () => {
    if (!gradoActual) return;
    const btn = document.getElementById('btnGuardarHorario');
    btn.disabled = true;
    btn.textContent = 'Guardando...';
    const horarioId = `${institucionId}__${gradoActual}`;
    try {
      await setDoc(doc(db, 'horarios', horarioId), {
        institucionId,
        grado: gradoActual,
        periodosPorDia: numPeriodos,
        grid,
        actualizadoPor: auth.currentUser.uid,
        fechaActualizacion: serverTimestamp(),
      });
      const msg = document.getElementById('mensajeGuardado');
      msg.className = 'mensaje-guardado ok visible';
      msg.textContent = '✓ Horario guardado correctamente.';
    } catch (err) {
      console.error(err);
      const msg = document.getElementById('mensajeGuardado');
      msg.className = 'mensaje-guardado warn visible';
      msg.textContent = 'No se pudo guardar. Intenta de nuevo.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar horario';
    }
  });

  document.getElementById('btnSalir').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
