<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EduGestión — Boletines</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1A4F8A; --azul-dark: #123769; --azul-light: #EBF2FB;
  --verde: #1A7A5E; --verde-light: #E8F5F0;
  --rojo: #C53030; --rojo-light: #FFF5F5;
  --amarillo: #B7791F; --amarillo-light: #FFF9E6;
  --gris: #F4F6F9; --borde: #DDE3EC;
  --texto: #1A2332; --texto-mid: #4A5568; --texto-light: #8896A7;
  --blanco: #FFFFFF;
}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--gris); color: var(--texto); min-height: 100vh; }

.topbar { background: var(--azul); height: 58px; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 0.9rem; }
.topbar-back { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.85; }
.topbar-back:hover { opacity: 1; }
.topbar-brand { font-size: 1.0rem; font-weight: 700; color: white; }
.btn-salir { background: rgba(255,255,255,0.12); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit; }

.main { max-width: 950px; margin: 0 auto; padding: 2.2rem 2rem 4rem; }
.titulo { font-family: 'Instrument Serif', serif; font-size: 1.8rem; margin-bottom: 1.5rem; }

.filtros-box { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; padding: 1.3rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: end; }
.filtro-field { flex: 1; min-width: 200px; }
.filtro-field label { display: block; font-size: 0.74rem; font-weight: 700; color: var(--texto-mid); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.03em; }
.filtro-field select { width: 100%; padding: 0.6rem 0.7rem; border: 1.5px solid var(--borde); border-radius: 8px; font-family: inherit; font-size: 0.85rem; background: white; }
.btn-imprimir { background: var(--verde); color: white; border: none; padding: 0.65rem 1.2rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
.btn-imprimir:hover { background: #145F49; }
.btn-imprimir:disabled { opacity: 0.5; cursor: default; }
.btn-grado { background: var(--azul); color: white; border: none; padding: 0.65rem 1.2rem; border-radius: 9px; font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; white-space: nowrap; }
.btn-grado:hover { background: var(--azul-dark); }
.btn-grado:disabled { opacity: 0.5; cursor: default; }

.aviso { text-align: center; padding: 3rem 1.5rem; color: var(--texto-light); font-size: 0.88rem; background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 12px; }

.boletin-box { display: none; }
.boletin-box.visible { display: block; }

.boletin-doc { background: var(--blanco); border: 1.5px solid var(--borde); border-radius: 14px; padding: 2rem; }
.boletin-header { display: flex; justify-content: space-between; align-items: start; border-bottom: 2px solid var(--texto); padding-bottom: 1.2rem; margin-bottom: 1.5rem; }
.boletin-inst { font-family: 'Instrument Serif', serif; font-size: 1.3rem; }
.boletin-inst-sub { font-size: 0.76rem; color: var(--texto-light); margin-top: 0.2rem; }
.boletin-titulo-doc { font-size: 0.78rem; font-weight: 700; color: var(--azul); text-align: right; text-transform: uppercase; letter-spacing: 0.04em; }

.est-info { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 2rem; margin-bottom: 1.5rem; font-size: 0.85rem; }
.est-info div span { color: var(--texto-light); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; display: block; }

table { width: 100%; border-collapse: collapse; margin-bottom: 1.3rem; }
th { text-align: center; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--texto-light); padding: 0.6rem 0.5rem; background: var(--gris); border: 1px solid var(--borde); }
th:first-child { text-align: left; }
td { padding: 0.55rem 0.5rem; font-size: 0.82rem; border: 1px solid var(--borde); text-align: center; }
td:first-child { text-align: left; font-weight: 600; }
.nivel-chip { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 8px; }
.sin-nota { color: var(--texto-light); }

.resumen-final { display: flex; justify-content: space-between; align-items: center; background: var(--azul-light); border-radius: 10px; padding: 1rem 1.3rem; }

.logros-titulo { font-family: 'Instrument Serif', serif; font-size: 1.15rem; margin: 1.5rem 0 0.9rem; }
.logro-item { border-bottom: 1px solid var(--borde); padding: 0.8rem 0; }
.logro-item:last-child { border-bottom: none; }
.logro-materia { font-size: 0.82rem; font-weight: 700; margin-bottom: 0.3rem; }
.logro-periodo-txt { font-size: 0.8rem; color: var(--texto-mid); line-height: 1.5; margin-bottom: 0.25rem; }
.logro-periodo-txt b { color: var(--azul); font-weight: 700; }
.sin-logros { text-align: center; padding: 1.5rem; color: var(--texto-light); font-size: 0.82rem; }
.resumen-label { font-size: 0.78rem; color: var(--azul); font-weight: 600; }
.resumen-valor { font-family: 'Instrument Serif', serif; font-size: 1.6rem; color: var(--azul); }

.loading-wrap { text-align: center; padding: 2rem; color: var(--texto-light); font-size: 0.85rem; }

.progreso-masivo { background: var(--azul-light); border-radius: 10px; padding: 0.9rem 1.1rem; margin-bottom: 1.3rem; font-size: 0.82rem; color: var(--azul); display: none; }
.progreso-masivo.visible { display: block; }

.boletin-pagina { page-break-after: always; margin-bottom: 2rem; }
.boletin-pagina:last-child { page-break-after: auto; margin-bottom: 0; }

@media print {
  .topbar, .filtros-box, .btn-imprimir, .progreso-masivo { display: none !important; }
  body { background: white; }
  .main { padding: 0; max-width: 100%; }
  .boletin-doc { border: none; padding: 0; }
  .boletin-pagina { margin-bottom: 0; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <a href="dashboard.html" class="topbar-back">← Panel</a>
    <span class="topbar-brand">Boletines</span>
  </div>
  <button class="btn-salir" id="btnSalir">Salir</button>
</header>

<main class="main">
  <p class="titulo">Boletín de Calificaciones</p>

  <div class="filtros-box">
    <div class="filtro-field">
      <label>Grado / Grupo</label>
      <select id="selGrado"><option value="">Selecciona...</option></select>
    </div>
    <div class="filtro-field">
      <label>Estudiante</label>
      <select id="selEstudiante"><option value="">Selecciona un grado primero</option></select>
    </div>
    <button class="btn-imprimir" id="btnImprimir" disabled>Imprimir / Guardar PDF</button>
    <button class="btn-grado" id="btnGenerarGrado" disabled>Generar boletines de todo el grado</button>
  </div>

  <div class="progreso-masivo" id="progresoMasivo"></div>

  <div class="aviso" id="avisoVacio">Selecciona un grado/grupo y un estudiante para ver su boletín, o usa "Generar boletines de todo el grado" para producirlos todos de una vez.</div>

  <div class="boletin-box" id="boletinBox">
    <div class="boletin-doc" id="boletinDoc"></div>
  </div>

  <div class="boletin-box" id="boletinesMultiBox">
    <div id="contenedorMultiples"></div>
  </div>
</main>

<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc, collection, getDocs, query, where } from './firebase.js';

  let institucionId = null;
  let institucionNombre = '';
  let escalaCalificacion = null;
  let estudiantesCache = [];
  let asignaturasCache = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    const usuarioSnap = await getDoc(doc(db, 'usuarios', user.uid));
    if (!usuarioSnap.exists()) { window.location.href = 'index.html'; return; }
    const usuarioActual = usuarioSnap.data();
    institucionId = usuarioActual.institucionId;

    const instSnap = await getDoc(doc(db, 'instituciones', institucionId));
    if (instSnap.exists()) {
      const inst = instSnap.data();
      institucionNombre = inst.nombre;
      escalaCalificacion = inst.escalaCalificacion;
    }

    const [estSnap, asigSnap] = await Promise.all([
      getDocs(query(collection(db, 'estudiantes'), where('institucionId', '==', institucionId))),
      getDocs(query(collection(db, 'asignaturas'), where('institucionId', '==', institucionId))),
    ]);
    estSnap.forEach(d => estudiantesCache.push({ id: d.id, ...d.data() }));
    asigSnap.forEach(d => asignaturasCache.push({ id: d.id, ...d.data() }));

    llenarSelectGrados();
  });

  function llenarSelectGrados() {
    const grados = [...new Set(estudiantesCache.map(e => e.grado).filter(Boolean))].sort();
    const sel = document.getElementById('selGrado');
    sel.innerHTML = '<option value="">Selecciona...</option>' + grados.map(g => `<option value="${g}">${g}</option>`).join('');
  }

  document.getElementById('selGrado').addEventListener('change', () => {
    const grado = document.getElementById('selGrado').value;
    const selEst = document.getElementById('selEstudiante');
    const btnGrado = document.getElementById('btnGenerarGrado');
    if (!grado) {
      selEst.innerHTML = '<option value="">Selecciona un grado primero</option>';
      btnGrado.disabled = true;
      ocultarBoletin();
      return;
    }
    const estudiantesDelGrado = estudiantesCache
      .filter(e => e.grado === grado)
      .sort((a, b) => (a.apellidos || '').localeCompare(b.apellidos || ''));
    if (estudiantesDelGrado.length === 0) {
      selEst.innerHTML = '<option value="">No hay estudiantes en este grado</option>';
      btnGrado.disabled = true;
    } else {
      selEst.innerHTML = '<option value="">Selecciona...</option>' +
        estudiantesDelGrado.map(e => `<option value="${e.id}">${e.apellidos} ${e.nombres}</option>`).join('');
      btnGrado.disabled = false;
    }
    ocultarBoletin();
  });

  document.getElementById('selEstudiante').addEventListener('change', cargarBoletin);

  function ocultarBoletin() {
    document.getElementById('avisoVacio').style.display = 'block';
    document.getElementById('boletinBox').classList.remove('visible');
    document.getElementById('boletinesMultiBox').classList.remove('visible');
    document.getElementById('btnImprimir').disabled = true;
    document.getElementById('progresoMasivo').classList.remove('visible');
  }

  function nivelDeNota(valor) {
    if (!escalaCalificacion || !escalaCalificacion.niveles || valor === null || valor === undefined) return null;
    return escalaCalificacion.niveles.find(n => valor >= n.min && valor <= n.max) || null;
  }

  function colorNivel(nombre) {
    const mapa = {
      'Superior': { bg: 'var(--verde-light)', c: 'var(--verde)' },
      'Alto': { bg: 'var(--azul-light)', c: 'var(--azul)' },
      'Básico': { bg: 'var(--amarillo-light)', c: 'var(--amarillo)' },
      'Bajo': { bg: 'var(--rojo-light)', c: 'var(--rojo)' },
      'Aprobado': { bg: 'var(--verde-light)', c: 'var(--verde)' },
      'Reprobado': { bg: 'var(--rojo-light)', c: 'var(--rojo)' },
    };
    return mapa[nombre] || { bg: 'var(--gris)', c: 'var(--texto-mid)' };
  }

  // ── Construye los datos de un boletín para un estudiante (compartido entre modo individual y masivo) ──
  async function obtenerDatosBoletin(estudiante, grado) {
    const asignaturasDelGrado = asignaturasCache
      .filter(a => !a.grado || a.grado === grado)
      .sort((a, b) => a.nombre.localeCompare(b.nombre));

    const notasSnap = await getDocs(query(collection(db, 'notas'), where('estudianteId', '==', estudiante.id)));
    const notasPorAsignatura = {};
    notasSnap.forEach(d => {
      const n = d.data();
      if (!notasPorAsignatura[n.asignaturaId]) notasPorAsignatura[n.asignaturaId] = {};
      notasPorAsignatura[n.asignaturaId][n.periodo] = n.valorNumerico;
      if (!notasPorAsignatura[n.asignaturaId].logros) notasPorAsignatura[n.asignaturaId].logros = {};
      if (n.logro) notasPorAsignatura[n.asignaturaId].logros[n.periodo] = n.logro;
    });

    let sumaPromedios = 0;
    let cantidadConNota = 0;
    const filasAsignaturas = asignaturasDelGrado.map(asig => {
      const notas = notasPorAsignatura[asig.id] || {};
      const p1 = notas[1], p2 = notas[2], p3 = notas[3], p4 = notas[4];
      const valores = [p1, p2, p3, p4].filter(v => v !== undefined && v !== null);
      const promedio = valores.length > 0 ? (valores.reduce((a, b) => a + b, 0) / valores.length) : null;
      const nivel = promedio !== null ? nivelDeNota(promedio) : null;
      if (promedio !== null) { sumaPromedios += promedio; cantidadConNota++; }
      return { nombre: asig.nombre, p1, p2, p3, p4, promedio, nivel };
    });

    const promedioGeneral = cantidadConNota > 0 ? (sumaPromedios / cantidadConNota) : null;

    const asignaturasConLogro = asignaturasDelGrado.filter(asig => {
      const logros = (notasPorAsignatura[asig.id] || {}).logros || {};
      return Object.keys(logros).length > 0;
    }).map(asig => {
      const logros = (notasPorAsignatura[asig.id] || {}).logros || {};
      const periodos = Object.keys(logros).sort();
      return { nombre: asig.nombre, periodos: periodos.map(p => ({ periodo: p, texto: logros[p] })) };
    });

    return { estudiante, grado, filasAsignaturas, promedioGeneral, asignaturasConLogro };
  }

  function renderBoletinHTML(datos) {
    const { estudiante, grado, filasAsignaturas, promedioGeneral, asignaturasConLogro } = datos;

    const celda = (v) => v !== undefined && v !== null ? v.toFixed(1) : '<span class="sin-nota">—</span>';

    const filasHtml = filasAsignaturas.length > 0
      ? filasAsignaturas.map(f => {
          const nivelHtml = f.nivel
            ? `<span class="nivel-chip" style="background:${colorNivel(f.nivel.nombre).bg};color:${colorNivel(f.nivel.nombre).c}">${f.nivel.nombre}</span>`
            : '<span class="sin-nota">—</span>';
          return `
            <tr>
              <td>${f.nombre}</td>
              <td>${celda(f.p1)}</td>
              <td>${celda(f.p2)}</td>
              <td>${celda(f.p3)}</td>
              <td>${celda(f.p4)}</td>
              <td><b>${f.promedio !== null ? f.promedio.toFixed(1) : '—'}</b></td>
              <td>${nivelHtml}</td>
            </tr>`;
        }).join('')
      : `<tr><td colspan="7" class="loading-wrap">Este grado todavía no tiene asignaturas cargadas.</td></tr>`;

    const logrosHtml = asignaturasConLogro.length === 0
      ? '<p class="sin-logros">Todavía no hay logros u observaciones registrados para este estudiante.</p>'
      : asignaturasConLogro.map(asig => {
          const textoLogros = asig.periodos.map(p => `<p class="logro-periodo-txt"><b>Periodo ${p.periodo}:</b> ${p.texto}</p>`).join('');
          return `<div class="logro-item"><p class="logro-materia">${asig.nombre}</p>${textoLogros}</div>`;
        }).join('');

    return `
      <div class="boletin-header">
        <div>
          <p class="boletin-inst">${institucionNombre || '—'}</p>
          <p class="boletin-inst-sub">Informe académico</p>
        </div>
        <p class="boletin-titulo-doc">Boletín de<br/>calificaciones</p>
      </div>

      <div class="est-info">
        <div><span>Estudiante</span><b>${estudiante.apellidos} ${estudiante.nombres}</b></div>
        <div><span>Documento</span><b>${estudiante.tipoDoc || ''} ${estudiante.documento || ''}</b></div>
        <div><span>Grado / Grupo</span><b>${grado}</b></div>
        <div><span>Año</span><b>2026</b></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Asignatura</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>Promedio</th><th>Nivel</th>
          </tr>
        </thead>
        <tbody>${filasHtml}</tbody>
      </table>

      <div class="resumen-final">
        <span class="resumen-label">Promedio general del año</span>
        <span class="resumen-valor">${promedioGeneral !== null ? promedioGeneral.toFixed(2) : 'Sin notas registradas'}</span>
      </div>

      <p class="logros-titulo">Logros y observaciones</p>
      <div>${logrosHtml}</div>
    `;
  }

  async function cargarBoletin() {
    const grado = document.getElementById('selGrado').value;
    const estudianteId = document.getElementById('selEstudiante').value;
    if (!grado || !estudianteId) { ocultarBoletin(); return; }

    const estudiante = estudiantesCache.find(e => e.id === estudianteId);
    if (!estudiante) { ocultarBoletin(); return; }

    document.getElementById('avisoVacio').style.display = 'none';
    document.getElementById('boletinesMultiBox').classList.remove('visible');
    document.getElementById('boletinBox').classList.add('visible');
    document.getElementById('btnImprimir').disabled = false;

    document.getElementById('boletinDoc').innerHTML = `<tr><td colspan="7" class="loading-wrap">Cargando...</td></tr>`;
    const datos = await obtenerDatosBoletin(estudiante, grado);
    document.getElementById('boletinDoc').innerHTML = renderBoletinHTML(datos);
  }

  document.getElementById('btnGenerarGrado').addEventListener('click', async () => {
    const grado = document.getElementById('selGrado').value;
    if (!grado) return;

    const estudiantesDelGrado = estudiantesCache
      .filter(e => e.grado === grado)
      .sort((a, b) => (a.apellidos || '').localeCompare(b.apellidos || ''));

    if (estudiantesDelGrado.length === 0) return;

    document.getElementById('avisoVacio').style.display = 'none';
    document.getElementById('boletinBox').classList.remove('visible');
    document.getElementById('boletinesMultiBox').classList.remove('visible');
    document.getElementById('btnImprimir').disabled = true;

    const btnGrado = document.getElementById('btnGenerarGrado');
    const progreso = document.getElementById('progresoMasivo');
    btnGrado.disabled = true;
    progreso.classList.add('visible');
    progreso.textContent = `Generando boletines... 0 / ${estudiantesDelGrado.length}`;

    const contenedor = document.getElementById('contenedorMultiples');
    contenedor.innerHTML = '';

    let listos = 0;
    for (const est of estudiantesDelGrado) {
      const datos = await obtenerDatosBoletin(est, grado);
      const wrap = document.createElement('div');
      wrap.className = 'boletin-doc boletin-pagina';
      wrap.innerHTML = renderBoletinHTML(datos);
      contenedor.appendChild(wrap);
      listos++;
      progreso.textContent = `Generando boletines... ${listos} / ${estudiantesDelGrado.length}`;
    }

    progreso.textContent = `✓ Se generaron ${listos} boletines de ${grado}. Da clic en "Imprimir / Guardar PDF" para exportarlos todos juntos (uno por página).`;
    document.getElementById('boletinesMultiBox').classList.add('visible');
    document.getElementById('btnImprimir').disabled = false;
    btnGrado.disabled = false;
  });

  document.getElementById('btnImprimir').addEventListener('click', () => window.print());

  document.getElementById('btnSalir').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
